function slot2Esc(s) {
  return escHtml(s);
}
function slot2ItemHref(url, id) {
  return (url || "https://items.eqresource.com/items.php?id={item_id}").replace("{item_id}", String(id));
}
function slot2ItemLink(url, name, id) {
  if (!name) return "";
  if (id) return `<a href="${slot2Esc(slot2ItemHref(url, id))}" target="_blank" rel="noopener">${slot2Esc(name)}</a>`;
  return slot2Esc(name);
}
function slot2RowKeys(row, data) {
  const keys = new Set();
  [row.personaKey, row.character, row.columnLabel, row.displayName].forEach((k) => {
    if (k) keys.add(k);
  });
  const meta = (data.characters || []).find((c) => c.personaKey === row.personaKey);
  if (meta) {
    [meta.personaKey, meta.character, meta.columnLabel, meta.displayName].forEach((k) => {
      if (k) keys.add(k);
    });
  }
  return keys;
}
function slot2MatchesChar(row, data) {
  const keys = slot2RowKeys(row, data);
  const toolbar = state.chars["slot2_augs"] || "";
  if (toolbar) return keys.has(toolbar);
  const filters = selectedCharacterFilters();
  if (!filters) return true;
  return filters.some((f) => keys.has(f.name) || keys.has(f.shortName));
}
function updateSlot2AugsContent(panel, section) {
  const data = section.data || {};
  const url = data.eqResourceItemUrl;
  const q = (state.searches[section.id] || "").trim().toLowerCase();
  const STATUS_LABELS = { bis: "BiS", upgrade: "Upgrade", empty: "Empty", unknown: "Unknown" };
  function pill(status) {
    const key = String(status || "").toLowerCase();
    const label = STATUS_LABELS[key] || status || "—";
    const cls = STATUS_LABELS[key] ? key : "unknown";
    return `<span class="status-pill ${slot2Esc(cls)}">${slot2Esc(label)}</span>`;
  }
  function slot2CraftBadge(owned, name, id) {
    if (!name) return "";
    const isHave = owned === true;
    const cls = isHave ? "badge badge-component" : "badge badge-need";
    const label = `${isHave ? "Have" : "Need"} ${slot2Esc(name)}`;
    if (id) {
      return `<a class="${cls}" href="${slot2Esc(slot2ItemHref(url, id))}" target="_blank" rel="noopener">${label}</a>`;
    }
    return `<span class="${cls}">${label}</span>`;
  }
  function badge(owned, moveFrom, craftOwned, craftName, craftId) {
    if (moveFrom) return `<span class="badge badge-owned">Move from ${slot2Esc(moveFrom)}</span>`;
    if (owned === true) return `<span class="badge badge-owned">Owned</span>`;
    if (owned === false) {
      return `<span class="badge badge-farm">Need to farm</span>` +
        slot2CraftBadge(craftOwned, craftName, craftId);
    }
    return "";
  }
  function signed(n) {
    const v = Number(n) || 0;
    return v > 0 ? `+${v}` : String(v);
  }
  const root = el("div", "slot2-augs");
  const meta = el("div", "meta");
  meta.textContent = [
    data.profileLabel,
    `Artisan's Prize: ${data.artisansPrizeOwned ? "owned" : "not owned"} (from inventory)`,
    `Anniversary augs: ${data.includeAnniversary ? "included" : "excluded"}`,
    data.catalogFromCache ? `Catalog: cache (${data.catalogFetchedAt || ""})` : `Catalog: live (${data.catalogFetchedAt || ""})`,
  ].filter(Boolean).join(" · ");
  root.appendChild(meta);
  const legend = el("div", "slot2-legend");
  legend.innerHTML = '<span><i class="swatch bis"></i> BiS</span><span><i class="swatch upgrade"></i> Upgrade</span><span><i class="swatch empty"></i> Empty</span><span><i class="swatch unknown"></i> Unknown</span>';
  root.appendChild(legend);

  function card(title, bodyContent, collapsed, extraHead, cardKey, titleTip) {
    const collapsedNow =
      cardKey && state.slot2Collapsed && Object.prototype.hasOwnProperty.call(state.slot2Collapsed, cardKey)
        ? state.slot2Collapsed[cardKey]
        : collapsed;
    const sectionEl = el("section", "card" + (collapsedNow ? " collapsed" : ""));
    const head = el("div", "card-head");
    const h2 = document.createElement("h2");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "card-toggle";
    btn.setAttribute("aria-expanded", collapsedNow ? "false" : "true");
    btn.innerHTML = `<span class="chevron" aria-hidden="true"></span>${slot2Esc(title)}`;
    btn.addEventListener("click", () => {
      const c = sectionEl.classList.toggle("collapsed");
      btn.setAttribute("aria-expanded", c ? "false" : "true");
      if (cardKey) {
        state.slot2Collapsed = state.slot2Collapsed || {};
        state.slot2Collapsed[cardKey] = c;
      }
    });
    h2.appendChild(btn);
    if (titleTip) {
      const help = document.createElement("span");
      help.className = "raid-bis-help raid-bis-tip";
      help.tabIndex = 0;
      help.setAttribute("aria-label", title + " note");
      help.setAttribute("data-tip", titleTip);
      help.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-help"></use></svg>';
      h2.appendChild(help);
    }
    head.appendChild(h2);
    if (extraHead) head.appendChild(extraHead);
    sectionEl.appendChild(head);
    const body = el("div", "card-body");
    if (typeof bodyContent === "string") body.innerHTML = bodyContent;
    else if (bodyContent) body.appendChild(bodyContent);
    sectionEl.appendChild(body);
    return sectionEl;
  }

  const summaries = (data.statSummary || []).filter((r) => slot2MatchesChar(r, data));
  let sumHtml;
  if (!(data.statSummary || []).length) sumHtml = '<p class="empty-msg">No suggested upgrades to summarize.</p>';
  else if (!summaries.length) sumHtml = '<p class="empty-msg">No summary for this character.</p>';
  else {
    let body = "";
    summaries.forEach((r) => {
      body += `<tr><td>${slot2Esc(r.displayName || r.columnLabel || r.character)}</td><td class="num">${r.slotsChanged || 0}</td>` +
        `<td class="num">${signed(r.focus)} ${slot2Esc(r.focusLabel || data.focusLabel || "HDex")}</td>` +
        `<td class="num">${signed(r.ac)}</td><td class="num">${signed(r.hp)}</td><td class="num">${signed(r.atk)}</td>` +
        `<td class="num">${signed(r.healAmount)}</td><td class="num">${signed(r.spellDamage)}</td><td class="num">${signed(r.clairvoyance)}</td></tr>`;
    });
    sumHtml = `<div class="table-scroll"><table><thead><tr><th>Character</th><th>Slots</th><th>Focus</th><th>AC</th><th>HP</th><th>ATK</th><th>Heal</th><th>Spell Dmg</th><th>Clairvoyance</th></tr></thead><tbody>${body}</tbody></table></div>`;
  }
  root.appendChild(card("Stat summary", sumHtml, false));

  let upgrades = (data.upgrades || []).filter((u) => slot2MatchesChar(u, data));
  if (q) upgrades = upgrades.filter((u) => JSON.stringify(u).toLowerCase().includes(q));
  let upHtml;
  if (!(data.upgrades || []).length) upHtml = '<p class="empty-msg">No graded type 7/8 slots found.</p>';
  else if (!upgrades.length) upHtml = '<p class="empty-msg">No rows for this character.</p>';
  else {
    let body = "";
    upgrades.forEach((u) => {
      const cur = u.currentName ? slot2ItemLink(url, u.currentName, u.currentId) : '<span class="muted-cell">(empty)</span>';
      const rec = u.recommendedName ? slot2ItemLink(url, u.recommendedName, u.recommendedId) + badge(u.recommendedOwned, u.moveFromSlot, u.craftComponentOwned, u.craftComponentName, u.craftComponentId) : "";
      const status = String(u.status || "").toLowerCase();
      body += `<tr class="status-${slot2Esc(status)}"><td>${pill(status)}</td><td>${slot2Esc(u.displayName || u.character)}</td><td>${slot2Esc(u.gearSlot)}</td><td>${cur}</td><td>${rec}</td><td>${slot2Esc(u.recommendedExpansion || "")}</td><td class="muted-cell">${slot2Esc(u.note || "")}</td></tr>`;
    });
    upHtml = `<table><thead><tr><th>Status</th><th>Character</th><th>Slot</th><th>Current</th><th>Upgrade to</th><th>Expansion</th><th>Note</th></tr></thead><tbody>${body}</tbody></table>`;
  }
  const slotRecTip =
    "These are recommendations. Some classes already sit at a stat cap, so it is up to you to decide whether a suggested change is the best fit.";
  root.appendChild(card("Slot recommendations", upHtml, false, null, null, slotRecTip));

  let farm = (data.farmList || []).filter((f) => slot2MatchesChar(f, data));
  if (q) farm = farm.filter((f) => JSON.stringify(f).toLowerCase().includes(q));
  const farmCols = [
    { key: "character", label: "Character", value: (f) => f.displayName || f.character || "" },
    { key: "gearSlot", label: "Slot", value: (f) => f.gearSlot || "" },
    { key: "name", label: "Aug", value: (f) => f.name || "" },
    { key: "expansion", label: "Expansion", value: (f) => f.expansion || "" },
  ];
  let farmBody;
  if (!(data.farmList || []).length) farmBody = '<p class="empty-msg">No recommended upgrades to farm.</p>';
  else if (!farm.length) farmBody = '<p class="empty-msg">No farm targets for this character.</p>';
  else {
    const wrap = el("div", "table-scroll");
    const table = el("table", "farm-table");
    const thead = document.createElement("thead");
    const headRow = document.createElement("tr");
    const tbody = document.createElement("tbody");
    const farmRows = [];
    function applyFarmSort() {
      const sort = state.sorts.slot2_farm || { col: null, dir: 1 };
      [...headRow.children].forEach((th, i) => {
        th.className = sort.col === farmCols[i].key ? (sort.dir > 0 ? "sort-asc" : "sort-desc") : "";
      });
      const col = farmCols.find((c) => c.key === sort.col);
      if (!col) return;
      farmRows.slice().sort((a, b) => {
        const primary = sort.dir * compareValues(col.value(a.data), col.value(b.data));
        if (primary) return primary;
        return compareValues(a.data.displayName || a.data.character, b.data.displayName || b.data.character);
      }).forEach((item) => tbody.appendChild(item.tr));
    }
    farmCols.forEach((col) => {
      const th = el("th", null, col.label);
      th.addEventListener("click", () => {
        const next = state.sorts.slot2_farm || { col: null, dir: 1 };
        if (next.col === col.key) next.dir *= -1;
        else { next.col = col.key; next.dir = 1; }
        state.sorts.slot2_farm = next;
        applyFarmSort();
      });
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);
    farm.forEach((f) => {
      const tr = document.createElement("tr");
      const aug = slot2ItemLink(url, f.name, f.itemId) + slot2CraftBadge(f.craftComponentOwned, f.craftComponentName, f.craftComponentId);
      tr.innerHTML =
        `<td>${slot2Esc(f.displayName || f.character)}</td><td>${slot2Esc(f.gearSlot)}</td>` +
        `<td>${aug}</td><td>${slot2Esc(f.expansion || "")}</td>`;
      farmRows.push({ tr, data: f });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    applyFarmSort();
    wrap.appendChild(table);
    farmBody = wrap;
  }
  root.appendChild(card("Need to farm", farmBody, true, null, "farm"));

  const ranked = data.rankedAugs || [];
  const defaultFocus = data.defaultFocusFilter || data.focusLabel || "HDex";
  const focusOpts = (data.rankedProfiles || []).map((p) => p.label);
  let focus = state.slot2Focus || defaultFocus;
  if (focusOpts.length && !focusOpts.includes(focus)) focus = focusOpts[0] || defaultFocus;
  let type = state.slot2Type || "";
  let filtered = ranked;
  if (focus) filtered = filtered.filter((a) => (a.focusLabel || "") === focus);
  if (type) filtered = filtered.filter((a) => a.refType === type);
  if (q) filtered = filtered.filter((a) => JSON.stringify(a).toLowerCase().includes(q));
  const types = [...new Set(ranked.map((a) => a.refType || "General"))];
  const extra = el("div", "filters");
  if (focusOpts.length > 1) {
    const sel = document.createElement("select");
    focusOpts.forEach((lab) => {
      const o = document.createElement("option");
      o.value = lab; o.textContent = lab; if (lab === focus) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener("change", () => { state.slot2Focus = sel.value; refreshContent(); });
    extra.appendChild(el("label", null, "Focus"));
    extra.appendChild(sel);
  }
  const typeSel = document.createElement("select");
  const allOpt = document.createElement("option");
  allOpt.value = ""; allOpt.textContent = "All types";
  typeSel.appendChild(allOpt);
  types.forEach((t) => {
    const o = document.createElement("option");
    o.value = t; o.textContent = t; if (t === type) o.selected = true;
    typeSel.appendChild(o);
  });
  typeSel.addEventListener("change", () => { state.slot2Type = typeSel.value; refreshContent(); });
  extra.appendChild(el("label", null, "Type"));
  extra.appendChild(typeSel);
  let rankedHtml;
  if (!ranked.length) rankedHtml = '<p class="empty-msg">No ranked reference augs.</p>';
  else if (!filtered.length) rankedHtml = '<p class="empty-msg">No reference augs for this filter.</p>';
  else {
    let body = "";
    filtered.forEach((a, i) => {
      const st = a.stats || {};
      body += `<tr><td class="num muted-cell">${i + 1}</td><td>${slot2ItemLink(url, a.name, a.itemId)}</td>` +
        `<td class="num muted-cell">${a.itemId}</td><td class="num">${a.focusHeroic}</td><td class="num">${a.ac}</td>` +
        `<td class="num">${a.hp}</td><td class="num">${a.atk || st.atk || 0}</td>` +
        `<td class="num">${a.healAmount != null ? a.healAmount : (st.heal_amount || 0)}</td>` +
        `<td class="num">${a.spellDamage != null ? a.spellDamage : (st.spell_damage || 0)}</td>` +
        `<td class="num">${a.clairvoyance != null ? a.clairvoyance : (st.clairvoyance || 0)}</td>` +
        `<td>${slot2Esc(a.refType || "General")}</td><td class="muted-cell">${slot2Esc(a.slotText || "")}</td>` +
        `<td class="muted-cell">${slot2Esc(a.source || "")}</td></tr>`;
    });
    rankedHtml = `<div class="table-scroll"><table class="ranked-table"><thead><tr><th>#</th><th>Name</th><th>ID</th><th>${slot2Esc(focus)}</th><th>AC</th><th>HP</th><th>ATK</th><th>Heal</th><th>Spell Dmg</th><th>Clrv</th><th>Type</th><th>Slots</th><th>Source</th></tr></thead><tbody>${body}</tbody></table></div>`;
  }
  root.appendChild(card("Ranked reference augs", rankedHtml, true, extra));
  raidBisBindTipBalloons(root);
  panel.appendChild(root);
}

function type5RowKeys(row, data) {
  const keys = new Set();
  [row.personaKey, row.character, row.columnLabel, row.displayName].forEach((k) => {
    if (k) keys.add(k);
  });
  const meta = (data.characters || []).find((c) => c.personaKey === row.personaKey);
  if (meta) {
    [meta.personaKey, meta.character, meta.columnLabel, meta.displayName].forEach((k) => {
      if (k) keys.add(k);
    });
  }
  return keys;
}

function type5MatchesChar(row, data) {
  const keys = type5RowKeys(row, data);
  const toolbar = state.chars["type5_augs"] || "";
  if (toolbar) return keys.has(toolbar);
  const filters = selectedCharacterFilters();
  if (!filters) return true;
  return filters.some((f) => keys.has(f.name) || keys.has(f.shortName));
}

function type5PersonaKey(chOrRow) {
  return chOrRow.personaKey || chOrRow.displayName || chOrRow.columnLabel || chOrRow.character || "";
}

function updateType5AugsContent(panel, section) {
  const data = section.data || {};
  const url = data.eqResourceItemUrl;
  const q = (state.searches[section.id] || "").trim().toLowerCase();
  const root = el("div", "type5-augs");
  const meta = el("div", "meta");
  const catalog = data.catalogUrl
    ? `<a href="${slot2Esc(data.catalogUrl)}" target="_blank" rel="noopener">EQ Resource Type 5 list</a>`
    : "EQ Resource Type 5 list";
  meta.innerHTML =
    `Equipped type 5 augs only (no upgrade suggestions). Browse current options: ${catalog}.`;
  root.appendChild(meta);

  const matched = (data.rows || []).filter((r) => type5MatchesChar(r, data));
  let rows = matched;
  if (q) {
    rows = rows.filter((r) => {
      const hay = `${r.gearSlot || ""} ${r.name || ""} ${r.displayName || ""} ${r.character || ""}`.toLowerCase();
      return hay.includes(q);
    });
  }

  if (!(data.rows || []).length) {
    root.appendChild(el("p", "empty-msg", "No type 5 holes found on equipped gear."));
    panel.appendChild(root);
    return;
  }
  if (!rows.length) {
    root.appendChild(el("p", "empty-msg", "No rows for this character."));
    panel.appendChild(root);
    return;
  }

  const type5Cols = [
    { key: "gearSlot", label: "Slot", value: (r) => r.gearSlot || "" },
    { key: "expansion", label: "Expansion", value: (r) => r.expansion || "" },
    { key: "name", label: "Type 5 Aug", value: (r) => r.name || "Empty" },
    { key: "hstr", label: "HStr", value: (r) => (r.empty || !r.name ? -1 : Number(r.hstr) || 0) },
    { key: "hsta", label: "HSta", value: (r) => (r.empty || !r.name ? -1 : Number(r.hsta) || 0) },
    { key: "hint", label: "HInt", value: (r) => (r.empty || !r.name ? -1 : Number(r.hint) || 0) },
    { key: "hwis", label: "HWis", value: (r) => (r.empty || !r.name ? -1 : Number(r.hwis) || 0) },
    { key: "hagi", label: "HAgi", value: (r) => (r.empty || !r.name ? -1 : Number(r.hagi) || 0) },
    { key: "hdex", label: "HDex", value: (r) => (r.empty || !r.name ? -1 : Number(r.hdex) || 0) },
    { key: "hcha", label: "HCha", value: (r) => (r.empty || !r.name ? -1 : Number(r.hcha) || 0) },
  ];

  function groupRows(list) {
    const byKey = new Map();
    list.forEach((r) => {
      const key = type5PersonaKey(r);
      if (!byKey.has(key)) byKey.set(key, []);
      byKey.get(key).push(r);
    });
    return byKey;
  }

  const allByKey = groupRows(matched);
  const shownByKey = groupRows(rows);
  const chars = data.characters || [];
  const ordered = [];
  const seen = new Set();
  chars.forEach((ch) => {
    const key = type5PersonaKey(ch);
    if (!shownByKey.has(key)) return;
    ordered.push(ch);
    seen.add(key);
  });
  shownByKey.forEach((charRows, key) => {
    if (seen.has(key)) return;
    ordered.push({
      personaKey: key,
      character: charRows[0].character || key,
      displayName: charRows[0].displayName || charRows[0].character || key,
      classAbbr: "",
    });
  });

  const tableStates = [];

  function applyType5SortAll() {
    const sort = state.sorts.type5_augs || { col: null, dir: 1 };
    const col = type5Cols.find((c) => c.key === sort.col);
    tableStates.forEach(({ headRow, tbody, type5Rows }) => {
      [...headRow.children].forEach((th, i) => {
        th.className = sort.col === type5Cols[i].key ? (sort.dir > 0 ? "sort-asc" : "sort-desc") : "";
      });
      if (!col) return;
      type5Rows.slice().sort((a, b) => {
        const primary = sort.dir * compareValues(col.value(a.data), col.value(b.data));
        if (primary) return primary;
        return compareValues(a.data.gearSlot, b.data.gearSlot);
      }).forEach((item) => tbody.appendChild(item.tr));
    });
  }

  ordered.forEach((ch) => {
    const key = type5PersonaKey(ch);
    const charRows = shownByKey.get(key) || [];
    if (!charRows.length) return;
    const allForChar = allByKey.get(key) || charRows;
    const emptyCount = allForChar.filter((r) => !!r.empty || !r.name).length;

    const card = el("div", "card");
    card.dataset.personaKey = key;
    const head = el("div", "card-head");
    head.appendChild(raidBisCharTitle(ch));
    const sub = el("div", "card-sub");
    sub.textContent = `${emptyCount} empty of ${allForChar.length} holes`;
    head.appendChild(sub);
    card.appendChild(head);

    const body = el("div", "card-body");
    const wrap = el("div", "table-scroll");
    const table = el("table", "type5-table");
    const thead = document.createElement("thead");
    const headRow = document.createElement("tr");
    const tbody = document.createElement("tbody");
    const type5Rows = [];

    type5Cols.forEach((col) => {
      const th = el("th", null, col.label);
      th.addEventListener("click", () => {
        const next = state.sorts.type5_augs || { col: null, dir: 1 };
        if (next.col === col.key) next.dir *= -1;
        else {
          next.col = col.key;
          next.dir = 1;
        }
        state.sorts.type5_augs = next;
        applyType5SortAll();
      });
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    charRows.forEach((r) => {
      const empty = !!r.empty || !r.name;
      const tr = document.createElement("tr");
      if (empty) tr.className = "status-empty";
      const aug = empty
        ? '<span class="muted-cell">Empty</span>'
        : slot2ItemLink(url, r.name, r.itemId);
      let expansionCell;
      if (empty) {
        expansionCell = '<td class="muted-cell">—</td>';
      } else if (r.expansionUrl) {
        const title = r.expansionTitle ? ` title="${slot2Esc(r.expansionTitle)}"` : "";
        expansionCell =
          `<td><a href="${slot2Esc(r.expansionUrl)}" target="_blank" rel="noopener"${title}>` +
          `${slot2Esc(r.expansion || "")}</a></td>`;
      } else {
        expansionCell = `<td>${slot2Esc(r.expansion || "")}</td>`;
      }
      const cells = [
        `<td>${slot2Esc(r.gearSlot || "")}</td>`,
        expansionCell,
        `<td class="col-aug">${aug}</td>`,
      ];
      ["hstr", "hsta", "hint", "hwis", "hagi", "hdex", "hcha"].forEach((k) => {
        cells.push(empty ? '<td class="num muted-cell">—</td>' : `<td class="num">${Number(r[k]) || 0}</td>`);
      });
      tr.innerHTML = cells.join("");
      type5Rows.push({ tr, data: r });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableStates.push({ headRow, tbody, type5Rows });
    wrap.appendChild(table);
    body.appendChild(wrap);
    card.appendChild(body);
    root.appendChild(card);
  });

  applyType5SortAll();
  panel.appendChild(root);
}

function type18FilterState() {
  if (!state.type18Filters) {
    state.type18Filters = {
      view: "suggestions",
      classAbbr: "",
      category: "",
      augType: "",
      anniversary: "all",
      groupBy: "lore",
    };
  }
  if (!state.type18Filters.view) state.type18Filters.view = "suggestions";
  if (!state.type18Filters.groupBy) state.type18Filters.groupBy = "lore";
  return state.type18Filters;
}

function type18RowLabel(r) {
  return r.typeLabel || (Number(r.augType) === 18 ? "18/19" : String(r.augType || ""));
}

function type18Characters(data) {
  return data.characters || [];
}

function type18FindCharacter(data, key) {
  const chars = type18Characters(data);
  if (!chars.length) return null;
  if (key) {
    const hit = chars.find((c) => c.key === key || c.name === key || c.displayName === key);
    if (hit) return hit;
  }
  return chars[0] || null;
}

function type18DefaultCharacter(data) {
  const chars = type18Characters(data);
  if (!chars.length) return null;
  const toolbarKey = state.chars.type18_augs || "";
  if (toolbarKey) {
    const hit = type18FindCharacter(data, toolbarKey);
    if (hit) return hit;
  }
  const targets = selectedCharacterNames();
  if (targets && targets.length === 1) {
    const match = chars.find(
      (c) => c.displayName === targets[0] || c.name === targets[0]
    );
    if (match) return match;
  }
  return chars[0];
}

function type18SuggestionOwned(sug, character) {
  if (!sug || !character) return false;
  const id = Number(sug.itemId) || 0;
  if (id > 0 && (character.ownedIds || []).includes(id)) return true;
  const name = String(sug.name || "").toLowerCase();
  if (!name) return false;
  return (character.ownedNames || []).some((n) => String(n).toLowerCase() === name);
}

function type18SuggestionEquippedLocation(sug, character) {
  if (!sug || !character) return "";
  const id = Number(sug.itemId) || 0;
  const byId = character.equippedLocationsById || {};
  if (id > 0) {
    const loc = byId[String(id)] || byId[id];
    if (loc) return String(loc);
  }
  const name = String(sug.name || "").toLowerCase();
  if (!name) return "";
  const byName = character.equippedLocationsByName || {};
  return byName[name] ? String(byName[name]) : "";
}

function type18CraftCopyHtml(name) {
  const text = String(name || "").trim();
  if (!text) return "";
  return (
    `<button type="button" class="type18-craft-copy" data-copy="${slot2Esc(text)}" ` +
    `title="Craftable — click to copy name" aria-label="Copy craftable aug name">` +
    `<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-anvil-craft"></use></svg>` +
    `</button>`
  );
}

const TYPE18_CARD_TIPS = [
  "These augs are suggestions—if you have a better option, use it.",
  "Click the anvil icon to copy an aug name to the clipboard, then paste it into EQ Traders or Sharecraft for recipes.",
];

function type18BindCardTitleTips(titleEl) {
  if (!titleEl) return;
  titleEl.tabIndex = 0;
  titleEl.addEventListener("mouseenter", () => showRaidBisTipBalloon(titleEl, TYPE18_CARD_TIPS));
  titleEl.addEventListener("mouseleave", hideRaidBisTipBalloon);
  titleEl.addEventListener("focus", () => showRaidBisTipBalloon(titleEl, TYPE18_CARD_TIPS));
  titleEl.addEventListener("blur", hideRaidBisTipBalloon);
}

function type18BindCraftCopy(root) {
  root.addEventListener("click", (ev) => {
    const btn = ev.target.closest(".type18-craft-copy");
    if (!btn || !root.contains(btn)) return;
    ev.preventDefault();
    ev.stopPropagation();
    const text = btn.getAttribute("data-copy") || "";
    if (!text) return;
    copyTextToClipboard(text)
      .then(() => {
        btn.classList.add("copied");
        showCopyBalloon(btn, text);
        setTimeout(() => btn.classList.remove("copied"), 900);
      })
      .catch(() => {});
  });
}

function type18DefaultClass(data) {
  const filters = type18FilterState();
  const character = type18DefaultCharacter(data);
  if (character && character.classAbbr) return character.classAbbr;
  if (filters.classAbbr) return filters.classAbbr;
  const team = data.teamClassAbbrs || [];
  const suggestions = data.suggestions || [];
  if (team.length) {
    const hit = suggestions.find((s) => s.classAbbr === team[0]);
    if (hit) return hit.classAbbr;
  }
  return suggestions.length ? suggestions[0].classAbbr : "";
}

function updateType18AugsContent(panel, section) {
  const data = section.data || {};
  const url = data.eqResourceItemUrl;
  const q = (state.searches[section.id] || "").trim().toLowerCase();
  const filters = type18FilterState();
  const root = el("div", "type18-augs");
  type18BindCraftCopy(root);

  const viewBar = el("div", "filters");
  viewBar.appendChild(el("span", "filter-label", "View"));
  [
    { value: "suggestions", label: "Suggestions" },
    { value: "catalog", label: "Full catalog" },
  ].forEach((opt) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "filter-chip" + ((filters.view || "suggestions") === opt.value ? " active" : "");
    chip.textContent = opt.label;
    chip.addEventListener("click", () => {
      filters.view = opt.value;
      refreshContent();
    });
    viewBar.appendChild(chip);
  });
  root.appendChild(viewBar);

  if ((filters.view || "suggestions") === "suggestions") {
    renderType18Suggestions(root, data, url, q, filters);
  } else {
    renderType18Catalog(root, data, url, q, filters);
  }
  panel.appendChild(root);
}

function renderType18Suggestions(root, data, url, q, filters) {
  const suggestions = data.suggestions || [];
  if (!suggestions.length) {
    root.appendChild(el("p", "empty-msg", "No class suggestions available."));
    return;
  }

  const characters = type18Characters(data);
  let character = null;
  if (characters.length) {
    character = type18DefaultCharacter(data);
    if (character) {
      filters.classAbbr = character.classAbbr || "";
      if (!state.chars.type18_augs) {
        state.chars.type18_augs = character.key || character.name || character.displayName || "";
      }
    }
  } else {
    if (!filters.classAbbr) filters.classAbbr = type18DefaultClass(data);
    const classBar = el("div", "filters");
    classBar.appendChild(el("span", "filter-label", "Class"));
    suggestions.forEach((block) => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "filter-chip" + (filters.classAbbr === block.classAbbr ? " active" : "");
      chip.textContent = block.classAbbr;
      chip.title = block.className;
      chip.addEventListener("click", () => {
        filters.classAbbr = block.classAbbr;
        refreshContent();
      });
      classBar.appendChild(chip);
    });
    root.appendChild(classBar);
  }

  const classAbbr = character
    ? character.classAbbr
    : filters.classAbbr || type18DefaultClass(data);
  const block = suggestions.find((s) => s.classAbbr === classAbbr) || suggestions[0];
  const casterStats = !!block.casterStats;
  const dexStats = !!block.dexStats;
  const statHeaders = casterStats
    ? ["Mana", "Spell Dmg"]
    : dexStats
      ? ["HDEX", "HP"]
      : ["AC", "HP"];
  const allRows = [
    ...(block.primary || []),
    ...(block.optional || []),
    ...(block.filler || []),
  ].map((r) => ({
    ...r,
    owned: type18SuggestionOwned(r.suggested, character),
    equippedLocation: type18SuggestionEquippedLocation(r.suggested, character),
  }));
  let rows = allRows;
  if (q) {
    rows = rows.filter((r) => {
      const sug = r.suggested || {};
      const alt = r.alternative || {};
      const hay = [
        r.guideName,
        sug.name,
        alt.name,
        sug.category,
        r.priority,
        r.owned ? "owned" : "",
        r.equippedLocation || "",
      ]
        .join(" ")
        .toLowerCase();
      return hay.includes(q);
    });
  }

  function renderPriority(title, list) {
    const card = el("div", "card");
    const head = el("div", "card-head");
    const who = character
      ? `${character.displayName || character.name} · ${block.className}`
      : block.className;
    const titleEl = el("div", "card-title type18-card-heading", `${who} · ${title}`);
    type18BindCardTitleTips(titleEl);
    head.appendChild(titleEl);
    head.appendChild(el("div", "card-sub", `${list.length} suggestion${list.length === 1 ? "" : "s"}`));
    card.appendChild(head);
    const body = el("div", "card-body");
    if (!list.length) {
      body.appendChild(el("p", "empty-msg", "None."));
      card.appendChild(body);
      root.appendChild(card);
      return;
    }
    const wrap = el("div", "table-scroll");
    const table = document.createElement("table");
    table.innerHTML =
      "<thead><tr>" +
      ["#", "Suggested", "Type", "Category", "Alternative", "Owned", ...statHeaders]
        .map((h) => `<th>${h}</th>`)
        .join("") +
      "</tr></thead>";
    const tbody = document.createElement("tbody");
    list.forEach((r) => {
      const sug = r.suggested || {};
      const alt = r.alternative || {};
      const tr = document.createElement("tr");
      if (r.anniversary || sug.anniversary) tr.classList.add("anniv");
      const nameBadges = [];
      if (sug.anniversary || r.anniversary) {
        nameBadges.push('<span class="badge anniv">Anniversary</span>');
      }
      if (r.upgraded) nameBadges.push('<span class="badge lore">Upgraded</span>');
      const sugCraft =
        sug.name && !(sug.anniversary || r.anniversary)
          ? type18CraftCopyHtml(sug.name)
          : "";
      const sugHtml = sug.name
        ? slot2ItemLink(url, sug.name, sug.itemId) + sugCraft + nameBadges.join("")
        : slot2Esc(r.guideName || "—");
      const altOwned = type18SuggestionOwned(alt, character);
      const altLocation = type18SuggestionEquippedLocation(alt, character);
      let altExtra = "";
      if (alt.name) {
        if (altOwned && altLocation) {
          altExtra =
            '<span class="badge owned">Owned</span>' +
            `<span class="badge equipped" title="Equipped in this gear slot">${slot2Esc(altLocation)}</span>`;
        } else {
          altExtra = type18CraftCopyHtml(alt.name);
        }
      }
      const altHtml = alt.name
        ? slot2ItemLink(url, alt.name, alt.itemId) + altExtra
        : (sug.anniversary || r.anniversary ? "<span class=\"muted\">—</span>" : "");
      let ownedHtml = "";
      if (r.owned) {
        ownedHtml = '<span class="badge owned">Owned</span>';
        if (r.equippedLocation) {
          ownedHtml +=
            `<span class="badge equipped" title="Equipped in this gear slot">${slot2Esc(r.equippedLocation)}</span>`;
        }
      }
      const statA = casterStats
        ? (Number(sug.mana) || 0)
        : dexStats
          ? (Number(sug.hdex) || 0)
          : (Number(sug.ac) || 0);
      const statB = casterStats ? (Number(sug.spellDamage) || 0) : (Number(sug.hp) || 0);
      tr.innerHTML = [
        `<td class="num">${Number(r.rank) || ""}</td>`,
        `<td class="col-name">${sugHtml}</td>`,
        `<td>${slot2Esc(sug.typeLabel || "")}</td>`,
        `<td>${slot2Esc(sug.category || "")}</td>`,
        `<td class="col-name">${altHtml}</td>`,
        `<td>${ownedHtml}</td>`,
        `<td class="num">${statA}</td>`,
        `<td class="num">${statB}</td>`,
      ].join("");
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    body.appendChild(wrap);
    card.appendChild(body);
    root.appendChild(card);
  }

  const primary = rows.filter((r) => r.priority === "primary");
  const optional = rows.filter((r) => r.priority === "optional");
  const filler = rows.filter((r) => r.priority === "filler");
  if (!rows.length) {
    root.appendChild(el("p", "empty-msg", "No suggestions match the search."));
    return;
  }
  renderPriority("Primary", primary);
  renderPriority("Optional", optional);
  renderPriority("Filler", filler);
}

function renderType18Catalog(root, data, url, q, filters) {
  const groupBar = el("div", "filters");
  groupBar.appendChild(el("span", "filter-label", "Group by"));
  [
    { value: "lore", label: "Lore" },
    { value: "category", label: "Category" },
  ].forEach((opt) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "filter-chip" + ((filters.groupBy || "lore") === opt.value ? " active" : "");
    chip.textContent = opt.label;
    chip.addEventListener("click", () => {
      filters.groupBy = opt.value;
      refreshContent();
    });
    groupBar.appendChild(chip);
  });
  root.appendChild(groupBar);

  const filterBar = el("div", "filters");
  filterBar.appendChild(el("span", "filter-label", "Category"));
  const categories = ["", ...(data.categories || [])];
  categories.forEach((cat) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "filter-chip" + ((filters.category || "") === cat ? " active" : "");
    chip.textContent = cat || "All";
    chip.addEventListener("click", () => {
      filters.category = cat;
      refreshContent();
    });
    filterBar.appendChild(chip);
  });
  root.appendChild(filterBar);

  const typeBar = el("div", "filters");
  typeBar.appendChild(el("span", "filter-label", "Type"));
  [
    { value: "", label: "All" },
    { value: "18/19", label: "18/19" },
    { value: "19", label: "19" },
  ].forEach((opt) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "filter-chip" + (String(filters.augType || "") === opt.value ? " active" : "");
    chip.textContent = opt.label;
    chip.addEventListener("click", () => {
      filters.augType = opt.value;
      refreshContent();
    });
    typeBar.appendChild(chip);
  });
  root.appendChild(typeBar);

  const annBar = el("div", "filters");
  annBar.appendChild(el("span", "filter-label", "Anniversary"));
  [
    { value: "all", label: "Include" },
    { value: "only", label: "Only" },
    { value: "hide", label: "Hide" },
  ].forEach((opt) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "filter-chip" + ((filters.anniversary || "all") === opt.value ? " active" : "");
    chip.textContent = opt.label;
    chip.addEventListener("click", () => {
      filters.anniversary = opt.value;
      refreshContent();
    });
    annBar.appendChild(chip);
  });
  root.appendChild(annBar);

  let rows = data.rows || [];
  if (filters.category) {
    rows = rows.filter((r) => r.category === filters.category);
  }
  if (filters.augType) {
    rows = rows.filter((r) => type18RowLabel(r) === filters.augType);
  }
  if (filters.anniversary === "hide") {
    rows = rows.filter((r) => !r.anniversary);
  } else if (filters.anniversary === "only") {
    rows = rows.filter((r) => !!r.anniversary);
  }
  if (q) {
    rows = rows.filter((r) => {
      const hay = [
        r.name,
        r.category,
        r.loreGroup,
        r.itemLore,
        type18RowLabel(r),
        r.augType,
      ].join(" ").toLowerCase();
      return hay.includes(q);
    });
  }

  if (!(data.rows || []).length) {
    root.appendChild(el("p", "empty-msg", "No Type 18/19 augs in the catalog."));
    return;
  }
  if (!rows.length) {
    root.appendChild(el("p", "empty-msg", "No augs match the current filters."));
    return;
  }

  const cols = [
    { key: "typeLabel", label: "Type", value: (r) => type18RowLabel(r) },
    { key: "name", label: "Name", value: (r) => r.name || "" },
    { key: "category", label: "Category", value: (r) => r.category || "" },
    { key: "loreGroup", label: "Lore group", value: (r) => r.loreGroup || r.itemLore || "" },
    { key: "ac", label: "AC", value: (r) => Number(r.ac) || 0 },
    { key: "hp", label: "HP", value: (r) => Number(r.hp) || 0 },
    { key: "mana", label: "Mana", value: (r) => Number(r.mana) || 0 },
    { key: "endurance", label: "End", value: (r) => Number(r.endurance) || 0 },
    { key: "hstr", label: "HStr", value: (r) => Number(r.hstr) || 0 },
    { key: "hsta", label: "HSta", value: (r) => Number(r.hsta) || 0 },
    { key: "hint", label: "HInt", value: (r) => Number(r.hint) || 0 },
    { key: "hwis", label: "HWis", value: (r) => Number(r.hwis) || 0 },
    { key: "hagi", label: "HAgi", value: (r) => Number(r.hagi) || 0 },
    { key: "hdex", label: "HDex", value: (r) => Number(r.hdex) || 0 },
    { key: "hcha", label: "HCha", value: (r) => Number(r.hcha) || 0 },
  ];

  const groupBy = filters.groupBy || "lore";
  const byGroup = new Map();
  rows.forEach((r) => {
    let key;
    if (groupBy === "lore") {
      key = r.loreGroup || r.itemLore || r.name || "Other";
    } else {
      key = r.category || "Other";
    }
    if (!byGroup.has(key)) byGroup.set(key, []);
    byGroup.get(key).push(r);
  });

  const groupKeys = Array.from(byGroup.keys()).sort((a, b) =>
    String(a).localeCompare(String(b), undefined, { sensitivity: "base" })
  );

  function renderTable(list, container) {
    const wrap = el("div", "table-scroll");
    const table = document.createElement("table");
    const thead = document.createElement("thead");
    const headRow = document.createElement("tr");
    const tbody = document.createElement("tbody");
    const rowState = [];

    function applySort() {
      const sort = state.sorts.type18_augs || { col: null, dir: 1 };
      const col = cols.find((c) => c.key === sort.col);
      Array.from(headRow.children).forEach((th, i) => {
        th.className = sort.col === cols[i].key ? (sort.dir > 0 ? "sort-asc" : "sort-desc") : "";
      });
      const ordered = rowState.slice().sort((a, b) => {
        if (!col) return 0;
        const av = col.value(a.data);
        const bv = col.value(b.data);
        if (typeof av === "number" && typeof bv === "number") return (av - bv) * sort.dir;
        return String(av).localeCompare(String(bv)) * sort.dir;
      });
      ordered.forEach(({ tr }) => tbody.appendChild(tr));
    }

    cols.forEach((col) => {
      const th = document.createElement("th");
      th.textContent = col.label;
      th.addEventListener("click", () => {
        const next = state.sorts.type18_augs || { col: null, dir: 1 };
        if (next.col === col.key) next.dir = -next.dir;
        else {
          next.col = col.key;
          next.dir =
            col.key === "name" || col.key === "loreGroup" || col.key === "category" || col.key === "typeLabel"
              ? 1
              : -1;
        }
        state.sorts.type18_augs = next;
        applySort();
      });
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    list.forEach((r) => {
      const tr = document.createElement("tr");
      if (r.anniversary) tr.classList.add("anniv");
      const loreText = r.loreGroup || r.itemLore || "";
      const badges = [];
      if (r.loreGroup) {
        badges.push('<span class="badge lore" title="Only one of this lore group may be equipped">Lore 1</span>');
      }
      if (r.anniversary) badges.push('<span class="badge anniv">Anniversary</span>');
      const craftBtn = !r.anniversary && r.name ? type18CraftCopyHtml(r.name) : "";
      const nameHtml = slot2ItemLink(url, r.name, r.itemId) + craftBtn + badges.join("");
      const label = type18RowLabel(r);
      tr.innerHTML = [
        `<td>${slot2Esc(label)}</td>`,
        `<td class="col-name">${nameHtml}</td>`,
        `<td>${slot2Esc(r.category || "")}</td>`,
        `<td class="col-lore">${slot2Esc(loreText)}</td>`,
        `<td class="num">${Number(r.ac) || 0}</td>`,
        `<td class="num">${Number(r.hp) || 0}</td>`,
        `<td class="num">${Number(r.mana) || 0}</td>`,
        `<td class="num">${Number(r.endurance) || 0}</td>`,
        `<td class="num">${Number(r.hstr) || 0}</td>`,
        `<td class="num">${Number(r.hsta) || 0}</td>`,
        `<td class="num">${Number(r.hint) || 0}</td>`,
        `<td class="num">${Number(r.hwis) || 0}</td>`,
        `<td class="num">${Number(r.hagi) || 0}</td>`,
        `<td class="num">${Number(r.hdex) || 0}</td>`,
        `<td class="num">${Number(r.hcha) || 0}</td>`,
      ].join("");
      rowState.push({ tr, data: r });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    container.appendChild(wrap);
    applySort();
  }

  groupKeys.forEach((key) => {
    const groupRows = byGroup.get(key) || [];
    const card = el("div", "card");
    const head = el("div", "card-head");
    head.appendChild(el("div", "card-title", key));
    const subBits = [`${groupRows.length} aug${groupRows.length === 1 ? "" : "s"}`];
    if (groupBy === "lore") subBits.push("equip only one");
    head.appendChild(el("div", "card-sub", subBits.join(" · ")));
    card.appendChild(head);
    const body = el("div", "card-body");
    renderTable(groupRows, body);
    card.appendChild(body);
    root.appendChild(card);
  });
}

function raidBisMatchesChar(ch) {
  const toolbar = state.chars.raid_bis || "";
  if (toolbar) {
    return ch.personaKey === toolbar || ch.displayName === toolbar || ch.character === toolbar;
  }
  const targets = selectedCharacterNames();
  if (!targets) return true;
  return targets.some((name) => name === ch.displayName || name === ch.character);
}

function raidBisItemHtml(url, name, id, icons, iconId) {
  if (!name) return "";
  const href = slot2ItemHref(url, id);
  if (iconId && icons && icons[iconId]) {
    const img = `<img src="${slot2Esc(icons[iconId])}" alt="${slot2Esc(name)}">`;
    if (id) {
      return `<a href="${slot2Esc(href)}" target="_blank" rel="noopener">${img}</a>`;
    }
    return img;
  }
  if (id) {
    return `<a href="${slot2Esc(href)}" target="_blank" rel="noopener">${slot2Esc(name)}</a>`;
  }
  return slot2Esc(name);
}

function raidBisFormatDeltas(deltas, keys, labels) {
  const parts = [];
  (keys || []).forEach((k) => {
    if (!deltas || deltas[k] == null || !Number(deltas[k])) return;
    const label = (labels && labels[k]) || k;
    const n = Number(deltas[k]);
    parts.push(`${n > 0 ? "+" : ""}${n} ${label}`);
  });
  return parts.join(", ");
}

function raidBisSumDeltas(rows) {
  const totals = {};
  rows.forEach((r) => {
    Object.keys(r || {}).forEach((k) => {
      const v = Number(r[k]) || 0;
      if (!v) return;
      totals[k] = (totals[k] || 0) + v;
    });
  });
  return totals;
}

function raidBisApplyWaistChoice(ch, slot) {
  if (!slot || slot.gearSlot !== "Waist" || !(slot.choices || []).length) return slot;
  const key = ch.personaKey || ch.displayName || ch.character;
  const saved = state.raidBisWaist[key];
  let choice = null;
  if (saved != null) {
    choice = slot.choices.find((c) => String(c.itemId) === String(saved)) || null;
  }
  if (!choice) {
    choice = slot.choices.find((c) => c.itemId === slot.recommendedId)
      || slot.choices[0];
  }
  return Object.assign({}, slot, {
    recommendedName: choice.name,
    recommendedId: choice.itemId,
    recommendedTier: choice.tier || slot.recommendedTier,
    recommendedIconId: choice.iconId || slot.recommendedIconId,
    deltas: choice.deltas || {},
    deltaText: choice.deltaText || "",
    status: choice.status || slot.status,
    scoreGain: choice.scoreGain != null ? choice.scoreGain : slot.scoreGain,
    vendorCost: choice.vendorCost != null ? choice.vendorCost : slot.vendorCost,
    vendorItemName: choice.vendorItemName || slot.vendorItemName,
    vendorItemId: choice.vendorItemId || slot.vendorItemId,
    _waistChoiceId: choice.itemId,
  });
}

function raidBisResolvedSlots(ch) {
  return (ch.slots || []).map((s) =>
    s.gearSlot === "Waist" ? raidBisApplyWaistChoice(ch, s) : s
  );
}

function raidBisWaistSelectHtml(url, slot) {
  const choices = slot.choices || [];
  if (!choices.length) {
    return slot.recommendedName
      ? slot2ItemLink(url, slot.recommendedName, slot.recommendedId)
      : '<span class="muted-cell">—</span>';
  }
  const selected = slot._waistChoiceId || slot.recommendedId;
  let opts = "";
  choices.forEach((c) => {
    const sel = String(c.itemId) === String(selected) ? " selected" : "";
    const label = `${c.name} (${c.effectLabel})`;
    opts += `<option value="${slot2Esc(String(c.itemId))}"${sel}>${slot2Esc(label)}</option>`;
  });
  const href = slot.recommendedId
    ? slot2ItemHref(url, slot.recommendedId)
    : "";
  const link = href
    ? `<a class="waist-link" href="${slot2Esc(href)}" target="_blank" rel="noopener">${slot2Esc(slot.recommendedName || "EQ Resource")}</a>`
    : "";
  return `<div class="raid-bis-waist-pick"><select data-raid-bis-waist="1">${opts}</select>${link}</div>`;
}

function raidBisCostTip(slot, currencyName) {
  if (slot.vendorCost == null || slot.vendorCost === "") return "";
  const amount = String(slot.vendorCost);
  const curr = currencyName ? ` ${currencyName}` : "";
  const ore = slot.vendorItemName && slot.vendorItemName !== slot.recommendedName
    ? ` · ${slot.vendorItemName}`
    : "";
  return amount + curr + ore;
}

function raidBisCoinHtml(slot, currencyName, icons, currencyIconId) {
  const tip = raidBisCostTip(slot, currencyName);
  if (!tip) return "";
  let inner = '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-coins"></use></svg>';
  if (currencyIconId && icons && icons[currencyIconId]) {
    inner = `<img src="${slot2Esc(icons[currencyIconId])}" alt="">`;
  }
  return `<span class="raid-bis-coin raid-bis-tip" data-tip="${slot2Esc(tip)}" tabindex="0">${inner}</span>`;
}

function hideRaidBisTipBalloon() {

function raidBisSectionTips(currencyName) {
  const lines = [
    "Current raid gear only.",
    "Evolvers are not scored and may still be BiS — vendor cost is still shown, but they are skipped when choosing coin purchases.",
    "Waist belts are a personal choice — pick among the three effect belts in Best in slot.",
  ];
  if (currencyName) {
    lines.push(
      `Enter this character's ${currencyName} to mark the best vendor ore purchase(s) among upgrades.`
    );
  }
  return lines;
}

function showRaidBisTipBalloon(anchor, text) {
  hideRaidBisTipBalloon();
  if (!anchor || !text || (Array.isArray(text) && !text.length)) return;
  const balloon = el("div", "copy-balloon raid-bis-coin-balloon");
  balloon.id = "raidBisCoinBalloon";
  if (Array.isArray(text)) {
    balloon.classList.add("raid-bis-title-balloon");
    const list = document.createElement("ul");
    list.className = "raid-bis-tip-list";
    text.forEach((line) => {
      const item = document.createElement("li");
      item.textContent = line;
      list.appendChild(item);
    });
    balloon.appendChild(list);
  } else {
    if (String(text).length > 80) balloon.classList.add("raid-bis-title-balloon");
    balloon.appendChild(el("div", "copy-balloon-name", text));
  }
  document.body.appendChild(balloon);
  const rect = anchor.getBoundingClientRect();
  const width = balloon.offsetWidth;
  const height = balloon.offsetHeight;
  let left = rect.left + rect.width / 2 - width / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - width - 8));
  let top = rect.top - height - 8;
  if (top < 8) top = rect.bottom + 8;
  balloon.style.left = left + "px";
  balloon.style.top = top + "px";
}

function hideRaidBisCoinBalloon() {
  hideRaidBisTipBalloon();
}

function showRaidBisCoinBalloon(anchor, text) {
  showRaidBisTipBalloon(anchor, text);
}

function raidBisBindTipBalloons(root) {
  root.querySelectorAll(".raid-bis-tip").forEach((node) => {
    const tip = node.getAttribute("data-tip") || "";
    node.addEventListener("mouseenter", () => showRaidBisTipBalloon(node, tip));
    node.addEventListener("mouseleave", hideRaidBisTipBalloon);
    node.addEventListener("focus", () => showRaidBisTipBalloon(node, tip));
    node.addEventListener("blur", hideRaidBisTipBalloon);

    if (s.currentIsEvolver) return false;
    return Number(s.vendorCost) > 0 && Number(s.scoreGain) > 0;
  }).map((s) => ({
    gearSlot: s.gearSlot,
    cost: Number(s.vendorCost),
    scoreGain: Number(s.scoreGain) || 0,
    itemId: s.recommendedId || 0,
    name: s.recommendedName || "",
  }));
}

function raidBisBestPurchases(items, coins) {
  // Keep in sync with inventory_parser.raid_bis.vendor.best_purchases.
  const budget = Math.max(0, Math.floor(Number(coins) || 0));
  if (budget <= 0) return [];
  let aff = (items || []).filter((it) => it.cost > 0 && it.scoreGain > 0 && it.cost <= budget);
  if (!aff.length) return [];
  if (aff.length > 20) {
    aff = aff.slice().sort((a, b) => (b.scoreGain / b.cost) - (a.scoreGain / a.cost)).slice(0, 20);
  }
  const n = aff.length;
  let bestGain = -1;
  let bestCount = -1;
  let bestCost = 0;
  let bestMask = 0;
  const limit = 1 << n;
  for (let mask = 1; mask < limit; mask++) {
    let cost = 0;
    let gain = 0;
    let count = 0;
    let over = false;
    for (let i = 0; i < n; i++) {
      if (!(mask & (1 << i))) continue;
      cost += aff[i].cost;
      if (cost > budget) { over = true; break; }
      gain += aff[i].scoreGain;
      count += 1;
    }
    if (over) continue;
    let better = gain > bestGain + 1e-9;
    if (!better && Math.abs(gain - bestGain) <= 1e-9) {
      if (count > bestCount) better = true;
      else if (count === bestCount && cost < bestCost) better = true;
    }
    if (better) {
      bestGain = gain;
      bestCount = count;
      bestCost = cost;
      bestMask = mask;
    }
  }
  const out = [];
  for (let i = 0; i < n; i++) {
    if (bestMask & (1 << i)) out.push(aff[i]);
  }
  return out;
}

function raidBisApplyPurchases(card, slots, coins, currencyName) {
  const picks = raidBisBestPurchases(raidBisPurchaseCandidates(slots), coins);
  const picked = new Set(picks.map((p) => p.gearSlot));
  card.querySelectorAll("tr[data-gear-slot]").forEach((tr) => {
    const bubble = tr.querySelector("[data-best-purchase]");
    if (!bubble) return;
    bubble.hidden = !picked.has(tr.getAttribute("data-gear-slot"));
  });
  const summary = card.querySelector("[data-raid-bis-buy-summary]");
  if (!summary) return;
  const curr = currencyName || "coins";
  if (!picks.length) {
    summary.textContent = coins > 0 ? "Not enough coins for a vendor upgrade." : "";
    return;
  }
  const total = picks.reduce((sum, p) => sum + p.cost, 0);
  const names = picks.map((p) => p.gearSlot).join(", ");
  summary.textContent = picks.length === 1
    ? `Best purchase: ${names} (${total} ${curr})`
    : `Best purchases: ${names} (${total} ${curr})`;
}

function updateRaidBisContent(panel, section) {
  hideRaidBisTipBalloon();
  const data = section.data || {};
  const url = data.eqResourceItemUrl;
  const icons = data.iconDataUris || {};
  const currencyIconId = data.currencyIconId || "";
  const q = (state.searches[section.id] || "").trim().toLowerCase();
  const root = el("div", "raid-bis");
  const currencyName = data.currencyName || "";
  const title = el("div", "raid-bis-title");
  const heading = el("h2", "raid-bis-heading");
  heading.textContent = "Raid BiS";
  heading.tabIndex = 0;
  const sectionTips = raidBisSectionTips(currencyName);
  heading.addEventListener("mouseenter", () => showRaidBisTipBalloon(heading, sectionTips));
  heading.addEventListener("mouseleave", hideRaidBisTipBalloon);
  heading.addEventListener("focus", () => showRaidBisTipBalloon(heading, sectionTips));
  heading.addEventListener("blur", hideRaidBisTipBalloon);
  title.appendChild(heading);
  root.appendChild(title);
  if (data.warnings && data.warnings.length) {
    data.warnings.forEach((w) => root.appendChild(el("p", "empty-msg", w)));
  }
  const chars = (data.characters || []).filter(raidBisMatchesChar);
  if (!chars.length) {
    root.appendChild(el("p", "empty-msg", "No characters match the current filter."));
    panel.appendChild(root);
    return;
  }
  chars.forEach((ch) => {
    const resolved = raidBisResolvedSlots(ch);
    const scored = resolved.filter((s) => s.scored !== false);
    const deltaParts = scored
      .filter((s) => s.status !== "bis")
      .map((s) => s.deltas || {});
    const totalDeltas = raidBisSumDeltas(deltaParts);
    const totalText = raidBisFormatDeltas(
      totalDeltas,
      ch.displayDeltaKeys,
      ch.statLabels
    ) || "No scored stat changes";
    const slotsChanged = scored.filter((s) => s.status === "upgrade" || s.status === "empty").length;

    const card = el("div", "card");
    card.dataset.personaKey = ch.personaKey || ch.displayName || ch.character || "";
    const head = el("div", "card-head");
    const headMain = el("div", "raid-bis-head-main");
    const titleRow = el("div", "card-title-row");
    const charKey = card.dataset.personaKey;
    const titleEl = raidBisCharTitle(ch);
    titleRow.appendChild(titleEl);
    const legend = el("div", "raid-bis-legend");
    legend.innerHTML = '<span><i class="swatch bis"></i> Green: already BiS</span><span><i class="swatch upgrade"></i> Gold: upgrade</span>';
    titleRow.appendChild(legend);
    headMain.appendChild(titleRow);
    const sub = el("div", "card-sub");
    sub.className = "card-sub raid-bis-total";
    sub.textContent = totalText +
      (slotsChanged ? ` • ${slotsChanged} slot(s) to upgrade` : " • already BiS");
    headMain.appendChild(sub);
    head.appendChild(headMain);
    const buySummary = el("p", "raid-bis-buy-summary");
    buySummary.dataset.raidBisBuySummary = "1";
    if (currencyName) {
      const coinsWrap = el("div", "raid-bis-coins");
      const coinsLabel = el("label", "raid-bis-coins-field");
      coinsLabel.appendChild(el("span", "raid-bis-coins-label", currencyName));
      const coinsInput = document.createElement("input");
      coinsInput.type = "number";
      coinsInput.min = "0";
      coinsInput.step = "1";
      coinsInput.setAttribute("inputmode", "numeric");
      coinsInput.dataset.raidBisCoins = "1";
      coinsInput.placeholder = "0";
      const savedCoins = state.raidBisCoins[charKey];
      if (savedCoins != null && savedCoins !== "") coinsInput.value = String(savedCoins);
      coinsLabel.appendChild(coinsInput);
      coinsWrap.appendChild(coinsLabel);
      coinsWrap.appendChild(buySummary);
      head.appendChild(coinsWrap);
    } else {
      headMain.appendChild(buySummary);
    }
    card.appendChild(head);
    const body = el("div", "card-body");
    const doll = el("div", "raid-bis-paperdoll");
    const portrait = el("div", "raid-bis-portrait", ch.classAbbr || "");
    portrait.title = ch.displayName || ch.character;
    doll.appendChild(portrait);
    doll.appendChild(el("div", "raid-bis-spacer"));
    const bySlot = {};
    resolved.forEach((slot) => { bySlot[slot.gearSlot] = slot; });
    RAID_BIS_LAYOUT.forEach((slotName) => {
      const cls = RAID_BIS_SLOT_CLASS[slotName];
      if (!cls) return;
      const unscored = slotName === "Primary" || slotName === "Secondary" || slotName === "Ammo" || slotName === "Power Source";
      const slot = bySlot[slotName] || { gearSlot: slotName, status: "unknown", scored: !unscored };
      const box = el("div", `raid-bis-slot ${cls} status-${slot.status || "unknown"}`);
      if (slotName === "Waist") box.dataset.raidBisWaistSlot = "1";
      const showName = slot.status === "bis" || slot.status === "weapon"
        ? slot.currentName
        : (slot.recommendedName || slot.currentName);
      const showId = slot.status === "bis" || slot.status === "weapon"
        ? slot.currentId
        : (slot.recommendedId || slot.currentId);
      const iconId = slot.status === "bis" || slot.status === "weapon"
        ? slot.currentIconId
        : (slot.recommendedIconId || slot.currentIconId);
      if (showName && !(iconId && icons[iconId])) {
        console.warn("Paper doll missing icon", slotName, showName, iconId || "");
      }
      const recBit = slot.recommendedName && slot.recommendedName !== slot.currentName
        ? ` → ${slot.recommendedName}`
        : "";
      const costBit = slot.vendorCost != null
        ? ` (${slot.vendorCost}${currencyName ? ` ${currencyName}` : ""})`
        : "";
      box.title = `${slotName}: ${showName || "empty"}${recBit}${costBit}`;
      const wrap = el("div", "slot-name");
      wrap.innerHTML = raidBisItemHtml(url, showName, showId, icons, iconId);
      box.appendChild(wrap);
      if (slot.petFocus) box.appendChild(el("div", "pet-focus", "✦"));
      if (slot.currentIsEvolver) {
        const gem = el("div", "evolver-gem raid-bis-tip");
        gem.dataset.tip = "Evolver";
        gem.tabIndex = 0;
        gem.setAttribute("aria-label", "Evolver");
        gem.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-evolver"></use></svg>';
        box.appendChild(gem);
      }
      doll.appendChild(box);
    });
    body.appendChild(doll);
    const deltas = el("div", "raid-bis-deltas");
    let rows = scored.slice();
    if (q) {
      rows = rows.filter((s) => {
        const choiceNames = (s.choices || []).map((c) => c.name).join(" ");
        const hay = [s.gearSlot, s.currentName, s.recommendedName, s.deltaText, s.note, s.vendorItemName, choiceNames]
          .filter(Boolean).join(" ").toLowerCase();
        return hay.includes(q);
      });
    }
    let bodyRows = "";
    if (!rows.length) {
      bodyRows = '<tr><td colspan="4" class="muted-cell">No scored slots match the current filter.</td></tr>';
    } else {
      rows.forEach((s) => {
        const cur = raidBisEquippedHtml(url, s);
        const rec = raidBisRecCellHtml(url, s, currencyName, icons, currencyIconId);
        bodyRows += `<tr class="status-${slot2Esc(s.status || "")}" data-gear-slot="${slot2Esc(s.gearSlot)}"><td>${slot2Esc(s.gearSlot)}</td><td>${cur}</td><td>${rec}</td>` +
          `<td class="num raid-bis-delta-cell">${raidBisDeltaCellHtml(s)}</td></tr>`;
      });
    }
    deltas.innerHTML = `<table><thead><tr><th>Slot</th><th>Equipped</th><th>Best in slot</th><th>Stat changes</th></tr></thead><tbody>${bodyRows}</tbody></table>`;
    body.appendChild(deltas);
    card.appendChild(body);
    root.appendChild(card);

    card.querySelectorAll("select[data-raid-bis-waist]").forEach((sel) => {
      sel.addEventListener("change", () => {
        const key = card.dataset.personaKey || "";
        state.raidBisWaist[key] = sel.value;
        panel.innerHTML = "";
        updateRaidBisContent(panel, section);
      });
    });
    raidBisBindTipBalloons(card);
    const coinsInput = card.querySelector("input[data-raid-bis-coins]");
    if (coinsInput) {
      const applyCoins = () => {
        const key = card.dataset.personaKey || "";
        const raw = String(coinsInput.value || "").trim();
        state.raidBisCoins[key] = raw;
        raidBisApplyPurchases(card, resolved, Number(raw) || 0, currencyName);
      };
      coinsInput.addEventListener("input", applyCoins);
      applyCoins();
    }
  });
  panel.appendChild(root);
}

function groupedNavEntries() {
  const byId = new Map(REPORT.sections.map((section, idx) => [section.id, { section, idx }]));
  const used = new Set();
  const groups = [];
  for (const spec of REPORT.navGroups || []) {
    const items = (spec.sectionIds || [])
      .map((id) => byId.get(id))
      .filter(Boolean);
    items.forEach((item) => used.add(item.section.id));
    if (items.length) groups.push({ ...spec, items });
  }
  const leftovers = REPORT.sections
    .map((section, idx) => ({ section, idx }))
    .filter((item) => !used.has(item.section.id));
  if (leftovers.length) {
    groups.push({
      id: "other",
      title: "Other",
      icon: "icon-chest",
      items: leftovers,
    });
  }
  return groups;
}

function cssToken(name, fallback) {
  const value = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return value || fallback;
}

function measureTextWidth(text, font) {
  const canvas = measureTextWidth.canvas || (measureTextWidth.canvas = document.createElement("canvas"));
  const ctx = canvas.getContext("2d");
  if (!ctx) return text.length * 8;
  ctx.font = font;
  return ctx.measureText(text).width;
}

function svgEl(name, attrs) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", name);
  Object.entries(attrs || {}).forEach(([key, value]) => {
    if (value != null) node.setAttribute(key, String(value));
  });
  return node;
}

function paintTitleGraphic(title, subtitle, logoUri) {
  const h1 = document.getElementById("reportTitle");
  const metaEl = document.getElementById("reportMeta");
  if (!h1) return;

  const gold = cssToken("--gold", "#c9a84c");
  const panel = cssToken("--panel", "#141820");
  const border = cssToken("--border", "#2a3140");
  const text = cssToken("--text", "#eef0f4");
  const muted = cssToken("--muted", "#8b93a7");

  const titleFont = '700 26px "Segoe UI", system-ui, sans-serif';
  const subFont = '12px "Segoe UI", system-ui, sans-serif';
  const titleW = measureTextWidth(title, titleFont);
  const subW = measureTextWidth(subtitle, subFont);
  const crest = logoUri ? 40 : 0;
  const gap = logoUri ? 12 : 0;
  const padX = 18;
  const width = Math.ceil(Math.max(titleW, subW) + padX * 2 + crest + gap + 8);
  const height = 78;
  const textX = padX + crest + gap;
  const titleY = subtitle ? 34 : 44;
  const subY = 56;

  const svg = svgEl("svg", {
    viewBox: `0 0 ${width} ${height}`,
    width: String(width),
    height: String(height),
    role: "presentation",
    "aria-hidden": "true",
  });

  const defs = svgEl("defs");
  const filter = svgEl("filter", {
    id: "titleGoldPop",
    x: "-8%",
    y: "-40%",
    width: "116%",
    height: "180%",
  });
  filter.appendChild(svgEl("feDropShadow", {
    in: "SourceGraphic",
    dx: "0",
    dy: "1",
    stdDeviation: "0.2",
    "flood-color": gold,
    "flood-opacity": "0.95",
    result: "edge",
  }));
  filter.appendChild(svgEl("feDropShadow", {
    in: "SourceGraphic",
    dx: "0",
    dy: "0",
    stdDeviation: "2.4",
    "flood-color": gold,
    "flood-opacity": "0.32",
    result: "glow",
  }));
  const merge = svgEl("feMerge");
  merge.appendChild(svgEl("feMergeNode", { in: "glow" }));
  merge.appendChild(svgEl("feMergeNode", { in: "edge" }));
  merge.appendChild(svgEl("feMergeNode", { in: "SourceGraphic" }));
  filter.appendChild(merge);
  defs.appendChild(filter);
  svg.appendChild(defs);

  svg.appendChild(svgEl("rect", {
    x: "0.5",
    y: "0.5",
    width: String(width - 1),
    height: String(height - 1),
    rx: "18",
    fill: panel,
    stroke: border,
  }));
  svg.appendChild(svgEl("rect", {
    x: String(textX),
    y: String(titleY + 6),
    width: String(Math.max(titleW, 48)),
    height: "2",
    rx: "1",
    fill: gold,
    opacity: "0.9",
  }));

  if (logoUri) {
    svg.appendChild(svgEl("image", {
      href: logoUri,
      x: String(padX),
      y: String((height - crest) / 2),
      width: String(crest),
      height: String(crest),
    }));
  }

  const titleNode = svgEl("text", {
    x: String(textX),
    y: String(titleY),
    fill: text,
    "font-family": '"Segoe UI", system-ui, sans-serif',
    "font-size": "26",
    "font-weight": "700",
    "letter-spacing": "0.02em",
    filter: "url(#titleGoldPop)",
  });
  titleNode.textContent = title;
  svg.appendChild(titleNode);

  if (subtitle) {
    const subNode = svgEl("text", {
      x: String(textX),
      y: String(subY),
      fill: muted,
      "font-family": '"Segoe UI", system-ui, sans-serif',
      "font-size": "12",
    });
    subNode.textContent = subtitle;
    svg.appendChild(subNode);
  }

  const sr = el("span", "sr-only", subtitle ? `${title}. ${subtitle}` : title);
  h1.classList.add("title-graphic");
  h1.style.setProperty("--title-graphic-w", width + "px");
  h1.replaceChildren(svg, sr);
  if (metaEl) metaEl.classList.add("hidden");
}

function init() {
  const meta = REPORT.meta;
  if (meta.logoDataUri) {
    document.getElementById("logo").src = meta.logoDataUri;
    const favicon = document.getElementById("favicon");
    if (favicon) favicon.href = meta.logoDataUri;
  }
  const title = meta.reportTitle || "Team Inventory";
  const datePart = (meta.generatedAt || "").split(" ")[0];
  const appShort = meta.appNameShort || "EQGM";
  const versionPart = meta.version ? ` · ${appShort} v${meta.version}` : "";
  const subtitle = `${meta.characterCount || 0} characters · generated ${datePart}${versionPart}`;
  document.getElementById("reportMeta").textContent = subtitle;
  paintTitleGraphic(title, subtitle, meta.logoDataUri || "");

  const nav = document.getElementById("navList");
  const content = document.getElementById("content");
  const savedGroups = loadNavGroupExpanded();
  groupedNavEntries().forEach((group) => {
    const wrap = el("div", "nav-group");
    wrap.dataset.group = group.id;
    const expanded = savedGroups[group.id] === true;
    if (!expanded) wrap.classList.add("collapsed");

    const toggle = el("button", "nav-group-toggle");
    toggle.type = "button";
    toggle.setAttribute("aria-expanded", expanded ? "true" : "false");
    toggle.appendChild(icon(group.icon || "icon-chest"));
    toggle.appendChild(el("span", null, group.title));
    const chevron = icon("icon-chevron");
    chevron.classList.add("nav-chevron");
    toggle.appendChild(chevron);
    toggle.addEventListener("click", () => toggleNavGroup(wrap));
    wrap.appendChild(toggle);

    const items = el("div", "nav-group-items");
    group.items.forEach(({ section, idx }) => {
      const btn = el("button", "nav-btn");
      btn.type = "button";
      btn.dataset.idx = String(idx);
      btn.appendChild(icon(SECTION_ICONS[section.id] || "icon-chest"));
      btn.appendChild(document.createTextNode(section.title));
      btn.addEventListener("click", () => setActiveTab(idx));
      items.appendChild(btn);
    });
    wrap.appendChild(items);
    nav.appendChild(wrap);
  });

  REPORT.sections.forEach((section, idx) => {
    const panel = el("div", "panel" + (idx === 0 ? " active" : ""));
    panel.id = "panel-" + idx;
    content.appendChild(panel);
    if (idx === 0) updatePanelContent(panel, section);
  });
  syncNavActive();

  initCharacterFilter();
  updateToolbar();
  updateTierLegend();
}

if (REPORT) {
  init();
}
</script>
</body>
</html>
