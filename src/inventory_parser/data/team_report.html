<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Inventory Report</title>
<link rel="icon" id="favicon" href="">
<style>
:root {
  --bg: #0b0e11;
  --panel: #141820;
  --panel-hover: #1a2030;
  --input: #1c2230;
  --header: #1e2430;
  --text: #eef0f4;
  --muted: #8b93a7;
  --link: #8cb4ff;
  --border: #2a3140;
  --accent: #3b6fd4;
  --accent-soft: rgba(59, 111, 212, 0.15);
  --gold: #c9a84c;
  --gold-soft: rgba(201, 168, 76, 0.25);
  --heroic: #c4b5fd;
  --empty: #181c24;
  --sidebar-w: 240px;
  --row-alt: #191e28;
  --bis: #22c55e;
  --bis-soft: rgba(34, 197, 94, 0.14);
  --upgrade: #eab308;
  --upgrade-soft: rgba(234, 179, 8, 0.14);
  --empty-status: #ef4444;
  --empty-status-soft: rgba(239, 68, 68, 0.14);
  --unknown: #60a5fa;
  --unknown-soft: rgba(96, 165, 250, 0.14);
  --owned: #166534;
  --farm: #9a3412;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
}
#app { display: flex; min-height: 100vh; }
#sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 16px 0;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
  color: inherit;
}
.sidebar-brand img { width: 40px; height: 40px; object-fit: contain; flex-shrink: 0; }
.sidebar-brand span { font-weight: 600; font-size: 14px; line-height: 1.3; }
#navList { display: flex; flex-direction: column; gap: 10px; padding: 0 8px; }
.nav-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.nav-group + .nav-group {
  border-top: 1px solid var(--border);
  padding-top: 8px;
}
.nav-group-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 4px 6px 6px;
  border: 0;
  background: transparent;
  color: var(--gold);
  font: inherit;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-align: left;
  cursor: pointer;
}
.nav-group-toggle:hover { color: var(--text); }
.nav-group-toggle:focus-visible {
  outline: 2px solid var(--link);
  outline-offset: 2px;
  border-radius: 6px;
}
.nav-group.has-active .nav-group-toggle { color: var(--link); }
.nav-group.has-active.collapsed .nav-group-toggle {
  border-radius: 6px;
  background: var(--accent-soft);
}
.nav-group-toggle svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  fill: none;
  stroke: currentColor;
}
.nav-group-toggle span {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.nav-group-toggle .nav-chevron {
  width: 12px;
  height: 12px;
  margin-left: auto;
  transition: transform 0.15s ease;
}
.nav-group.collapsed .nav-chevron { transform: rotate(-90deg); }
.nav-group.collapsed .nav-group-items { display: none; }
.nav-group-items {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.nav-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--gold-soft);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text);
  font: inherit;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  transition:
    background 0.25s ease,
    border-color 0.25s ease,
    box-shadow 0.25s ease;
}
.nav-btn:hover {
  background: var(--panel-hover);
  border-color: var(--gold);
  box-shadow:
    0 8px 24px rgba(0, 0, 0, 0.35),
    0 0 0 1px var(--gold-soft);
}
.nav-btn:focus-visible {
  outline: 2px solid var(--link);
  outline-offset: 2px;
}
.nav-btn.active {
  background: #1e3a5f;
  border-color: var(--accent);
  border-left-color: var(--gold);
  color: #fff;
  box-shadow: 0 0 16px var(--accent-soft);
}
.nav-btn.active:hover {
  border-color: var(--gold);
  box-shadow:
    0 0 16px var(--accent-soft),
    0 0 0 1px var(--gold-soft);
}
.nav-btn svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  fill: none;
  stroke: var(--gold);
  opacity: 1;
}
.nav-btn.active svg { stroke: #fff; }
.char-filter-section {
  margin-top: 16px;
  padding: 16px 16px 0;
  border-top: 1px solid var(--border);
}
.char-filter-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin-bottom: 10px;
}
#characterFilter {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
  align-items: stretch;
}
.char-chip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  width: 100%;
  min-width: 0;
  padding: 5px 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--input);
  color: var(--text);
  font: inherit;
  font-size: 12px;
  line-height: 1.2;
  text-align: left;
  cursor: pointer;
  opacity: 1;
  transition: opacity 0.15s ease;
}
.char-chip-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 600;
}
.char-chip-class {
  flex: 0 0 2.6em;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-align: right;
  color: inherit;
  opacity: 0.8;
}
.char-chip.active .char-chip-class { opacity: 1; }
#characterFilter.has-filter .char-chip { opacity: 0.45; }
#characterFilter.has-filter .char-chip.active { opacity: 1; }
.char-chip[data-idx="all"] {
  justify-content: center;
}
.char-chip[data-idx="all"].active { border-color: var(--muted); }
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
#pageHeader {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 20px 24px 12px;
  border-bottom: 1px solid var(--border);
}
.page-header-row { flex: 1; min-width: 200px; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
#pageHeader h1 {
  margin: 0;
  line-height: 0;
}
#pageHeader h1.title-graphic svg {
  display: block;
  width: min(100%, var(--title-graphic-w, 420px));
  height: auto;
  max-width: 100%;
}
#pageHeader .meta { color: var(--muted); font-size: 12px; }
#toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
.search-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.search-wrap svg {
  position: absolute;
  left: 10px;
  width: 14px;
  height: 14px;
  color: var(--muted);
  pointer-events: none;
}
#toolbar input[type="search"] {
  background: var(--input);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 10px 7px 32px;
  font: inherit;
  min-width: 200px;
}
#toolbar select {
  background: var(--input);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 10px;
  font: inherit;
}
#toolbar label { color: var(--muted); font-size: 12px; }
#content { flex: 1; padding: 16px 24px; overflow: auto; }
.panel { display: none; }
.panel.active { display: block; }
.table-wrap {
  overflow: auto;
  max-height: calc(100vh - 220px);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.table-wrap a { text-decoration: underline; }
table { width: 100%; border-collapse: collapse; }
table.gear-table {
  width: max-content;
  min-width: 100%;
}
th, td {
  border: 1px solid var(--border);
  padding: 7px 10px;
  text-align: left;
  vertical-align: middle;
  white-space: nowrap;
}
.cell-chip {
  display: inline-block;
  margin-left: 8px;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
  vertical-align: middle;
  background: var(--empty-status-soft);
  color: #fca5a5;
  border: 1px solid rgba(239, 68, 68, 0.4);
}
th {
  background: var(--header);
  position: sticky;
  top: 0;
  z-index: 2;
  cursor: pointer;
  user-select: none;
  font-weight: 600;
  font-size: 12px;
}
th.sort-asc::after { content: " ▲"; font-size: 10px; }
th.sort-desc::after { content: " ▼"; font-size: 10px; }
th.sticky-col, td.sticky-col {
  position: sticky;
  left: 0;
  z-index: 3;
  background: var(--header);
  width: 1%;
  max-width: 96px;
  white-space: nowrap;
  padding-left: 8px;
  padding-right: 10px;
}
th.sticky-col svg {
  width: 12px;
  height: 12px;
  vertical-align: -2px;
  margin-right: 3px;
}
td.sticky-col { background: #161a22; z-index: 1; }
tr:nth-child(even) td:not(.sticky-col) { background: #12161e; }
tr:nth-child(odd) td:not(.sticky-col) { background: #161a22; }
td.empty { background: var(--empty) !important; color: var(--muted); text-align: center; }
td.empty::before { content: "—"; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
button.copy-item {
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  color: var(--link);
  font: inherit;
  cursor: pointer;
  text-align: left;
}
button.copy-item:hover { text-decoration: underline; }
button.copy-item.copied { color: #86efac; text-decoration: none; }
th.copy-col-head {
  cursor: help;
  text-decoration: underline dotted var(--muted);
  text-underline-offset: 3px;
}
.copy-balloon {
  position: fixed;
  z-index: 80;
  max-width: min(280px, calc(100vw - 16px));
  padding: 8px 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 12px;
  line-height: 1.35;
  pointer-events: none;
}
.copy-balloon-label {
  color: var(--muted);
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.copy-balloon-name { font-weight: 650; }
.char-head {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.char-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.block-title {
  margin: 18px 0 8px;
  padding: 8px 10px;
  background: var(--header);
  border-radius: 6px;
  font-weight: 600;
}
.block-sub { color: var(--muted); font-size: 12px; margin: -4px 0 8px; }
.hidden { display: none !important; }
.count-cell { text-align: center; font-weight: 600; }
.count-zero { color: var(--muted); }
#tierLegend {
  padding: 12px 24px 16px;
  border-top: 1px solid var(--border);
  background: var(--panel);
}
#tierLegend h3 {
  margin: 0 0 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--muted);
  text-transform: uppercase;
}
.legend-items { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
}
.legend-swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border); }
.legend-note { margin-left: auto; color: var(--muted); font-size: 11px; }
.section-credit {
  margin-top: 12px;
  font-size: 12px;
  color: var(--muted);
}
.section-credit a {
  color: #8cb4ff;
  text-decoration: underline;
}
.heroic-intro {
  color: var(--muted);
  max-width: 920px;
  margin: 0 0 14px;
  font-size: 13px;
}
.heroic-totals {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  max-width: 920px;
  margin-bottom: 16px;
}
.heroic-stat {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
}
.heroic-stat-label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.heroic-stat-value {
  font-size: 22px;
  font-weight: 700;
  margin-top: 4px;
}
.heroic-stat-value .max {
  color: var(--muted);
  font-size: 14px;
  font-weight: 500;
}
.heroic-totals-table {
  max-width: 920px;
  margin-bottom: 16px;
}
.heroic-group {
  max-width: 920px;
  margin-bottom: 16px;
}
.heroic-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
}
.heroic-row:last-child { border-bottom: none; }
.heroic-row-name { flex: 1; min-width: 0; }
.heroic-row-meta {
  color: var(--muted);
  font-size: 11px;
  margin-top: 2px;
}
.heroic-chips {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.heroic-chip {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  background: #1a2030;
  color: #4b5563;
  cursor: help;
}
.heroic-chip.on {
  background: var(--bis-soft);
  color: #86efac;
}
.heroic-status {
  width: 88px;
  text-align: right;
  font-size: 12px;
  font-weight: 650;
  flex-shrink: 0;
}
.heroic-status.completed { color: #86efac; }
.heroic-status.incomplete { color: #fca5a5; }
.heroic-empty {
  color: var(--muted);
  max-width: 920px;
}
@media (max-width: 900px) {
  .heroic-totals { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.quest-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 920px;
}
.quest-card {
  background: #050608;
  border: 1px solid #b08d4a;
  outline: 1px solid #6f572c;
  outline-offset: -3px;
}
.quest-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid #2a3140;
}
.quest-head svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  color: #9ec4ff;
}
.quest-title {
  flex: 1;
  text-align: center;
  font-weight: 650;
  font-size: 14px;
  color: #e8eaef;
}
.quest-meta {
  color: var(--muted);
  font-size: 11px;
  white-space: nowrap;
}
.quest-body { padding: 10px 16px 14px; }
.quest-status {
  color: #c9a06a;
  font-weight: 650;
  margin-bottom: 4px;
}
.quest-desc {
  color: #c9a06a;
  margin: 0 0 10px;
  font-size: 12.5px;
}
.quest-items {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.quest-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  color: #c9a06a;
  font-size: 13px;
}
.quest-item.done { color: #8f7a58; }
.quest-check {
  width: 13px;
  height: 13px;
  margin-top: 2px;
  border: 1px solid #c9a06a;
  background: #0a0a0a;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
  color: #e8eaef;
}
.quest-empty { color: var(--muted); margin: 12px 4px; }
.slot2-augs { display: flex; flex-direction: column; gap: 16px; }
.slot2-augs .card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.slot2-augs .card-head {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.slot2-augs .card-head h2 {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0;
}
.slot2-augs .card-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  font-size: 15px;
  font-weight: 650;
  cursor: pointer;
}
.slot2-augs .card-toggle .chevron {
  width: 0.55em;
  height: 0.55em;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
  transform: rotate(45deg);
  flex-shrink: 0;
}
.slot2-augs .card.collapsed .card-toggle .chevron { transform: rotate(-45deg); }
.slot2-augs .card.collapsed .card-head { border-bottom: none; }
.slot2-augs .card.collapsed .card-body,
.slot2-augs .card.collapsed .card-sub,
.slot2-augs .card.collapsed .card-head .filters { display: none; }
.slot2-augs .card-sub { margin: 0; color: var(--muted); font-size: 12px; width: 100%; }
.slot2-augs .table-scroll { overflow: auto; max-height: min(70vh, 820px); }
.slot2-augs table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.slot2-augs th, .slot2-augs td {
  padding: 9px 12px;
  vertical-align: top;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
.slot2-augs th {
  background: var(--header);
  color: #c5ccda;
  font-weight: 600;
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  position: sticky;
  top: 0;
  z-index: 2;
}
.slot2-augs .farm-table th {
  cursor: pointer;
  user-select: none;
}
.slot2-augs .farm-table th.sort-asc::after { content: " ▲"; font-size: 10px; }
.slot2-augs .farm-table th.sort-desc::after { content: " ▼"; font-size: 10px; }
.slot2-augs tbody tr.status-bis {
  box-shadow: inset 3px 0 0 var(--bis);
  background: linear-gradient(90deg, var(--bis-soft), transparent 28%);
}
.slot2-augs tbody tr.status-upgrade {
  box-shadow: inset 3px 0 0 var(--upgrade);
  background: linear-gradient(90deg, var(--upgrade-soft), transparent 28%);
}
.slot2-augs tbody tr.status-empty {
  box-shadow: inset 3px 0 0 var(--empty-status);
  background: linear-gradient(90deg, var(--empty-status-soft), transparent 28%);
}
.slot2-augs tbody tr.status-unknown {
  box-shadow: inset 3px 0 0 var(--unknown);
  background: linear-gradient(90deg, var(--unknown-soft), transparent 28%);
}
.slot2-augs .farm-table tbody tr:nth-child(even),
.slot2-augs .ranked-table tbody tr:nth-child(even) { background: var(--row-alt); }
.slot2-augs .status-pill {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
}
.slot2-augs .status-pill.bis { background: var(--bis-soft); color: #86efac; }
.slot2-augs .status-pill.upgrade { background: var(--upgrade-soft); color: #fde68a; }
.slot2-augs .status-pill.empty { background: var(--empty-status-soft); color: #fca5a5; }
.slot2-augs .status-pill.unknown { background: var(--unknown-soft); color: #93c5fd; }
.slot2-augs .badge {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 7px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 650;
  vertical-align: middle;
}
.slot2-augs .badge-owned { background: var(--owned); color: #ecfdf5; }
.slot2-augs .badge-farm { background: var(--farm); color: #fff7ed; }
.slot2-augs .badge-component { background: #1e3a5f; color: #bfdbfe; }

  padding: 10px 12px 12px;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow:
    0 12px 28px rgba(0, 0, 0, 0.45),
    0 0 0 1px var(--gold-soft),
    0 0 18px var(--gold-soft);
  font: 12px/1.4 "Segoe UI", system-ui, sans-serif;
  pointer-events: none;
}
.item-inspect-head {
  display: grid;
  grid-template-columns: 1fr 88px;
  gap: 8px;
  align-items: start;
  margin-bottom: 8px;
}
.item-inspect-name {
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  padding: 4px 4px 0;
  letter-spacing: 0.01em;
  line-height: 1.25;
  color: var(--text);
}
.item-inspect-expac { text-align: center; }
.item-inspect-expac img {
  width: 72px;
  height: auto;
  max-height: 40px;
  object-fit: contain;
  display: block;
  margin: 0 auto 4px;
}
.item-inspect-tier {
  color: var(--gold);
  font-size: 10px;
  font-weight: 700;
}
.item-inspect-identity {
  display: grid;
  grid-template-columns: 48px 1fr;
  gap: 10px;
  align-items: start;
  margin-bottom: 8px;
}
.item-inspect-icon {
  width: 40px;
  height: 40px;
  image-rendering: pixelated;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--empty);
}
.item-inspect-icon-empty {
  display: block;
  width: 40px;
  height: 40px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--empty);
}
.item-inspect-flags { color: var(--muted); }
.item-inspect-line { margin-top: 1px; }
.item-inspect-k { color: var(--gold); }
.item-inspect-aug {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 6px 0;
  color: var(--text);
}
.item-inspect-aug-well {
  width: 28px;
  height: 28px;
  flex: 0 0 28px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--input);
  box-shadow: inset 0 0 0 1px var(--gold-soft);
}
.item-inspect-stats {
  display: grid;
  gap: 8px 20px;
  margin-top: 8px;
}
.item-inspect-col {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  column-gap: 8px;
  row-gap: 1px;
  align-content: start;
}
.item-inspect-col .lab {
  color: var(--gold);
  white-space: nowrap;
}
.item-inspect-col .val {
  color: var(--text);
  font-weight: 650;
  white-space: nowrap;
}
.item-inspect-heroic { color: var(--heroic); font-weight: 700; }
.item-inspect-spells { margin-top: 8px; line-height: 1.45; }
.item-inspect-lore {
  margin-top: 8px;
  color: var(--muted);
  font-style: italic;
}
@media (max-width: 900px) {
  #app { flex-direction: column; }
  #sidebar {
    width: 100%;
    height: auto;
    position: static;
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
  .char-filter-section { margin-top: 12px; }
  #characterFilter { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}

<script>
const REPORT = /*__REPORT_JSON__*/;
function escHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);
}
function optionHtml(value, label) {
  return `<option value="${escHtml(value)}">${escHtml(label)}</option>`;
}
const SECTION_ICONS = {
  team_gear: "icon-shield",
  gear_t_level: "icon-chart",
  missing_runes: "icon-rune",
  rune_inventory: "icon-rune-stack",
  spell_list: "icon-book",
  missing_useful_spells: "icon-book",
  unmade_gear: "icon-anvil",
  missing_collections: "icon-chest",
  quests: "icon-scroll",
  raid_achievements: "icon-trophy",
  heroic_aas: "icon-trophy",
  achievement_summary: "icon-trophy",
  slot2_augs: "icon-gem",
  type5_augs: "icon-gem",
  type18_augs: "icon-gem",
  raid_bis: "icon-armor",
};
const CHAR_COLORS = [
  { border: "#3b82f6", dot: "#3b82f6" },
  { border: "#22c55e", dot: "#22c55e" },
  { border: "#a855f7", dot: "#a855f7" },
  { border: "#eab308", dot: "#eab308" },
  { border: "#f97316", dot: "#f97316" },
  { border: "#06b6d4", dot: "#06b6d4" },
  { border: "#ec4899", dot: "#ec4899" },
  { border: "#84cc16", dot: "#84cc16" },
];
const state = {
  activeTab: 0,
  characterFilters: [],
  slotFilter: "all",
  sorts: {},
  colSorts: {},
  searches: {},
  chars: {},
  expansions: {},
  zones: {},
  events: {},
  blocks: {},
  runes: {},
  status: {},
  raidBisWaist: {},
  raidBisCoins: {},
  copyBalloonTimer: 0,
  inspectCardTimer: 0,
};
function uniqueExpansionLabels(values) {
  const seen = new Set();
  const out = [];
  for (const value of values) {
    if (value && !seen.has(value)) {
      seen.add(value);
      out.push(value);
    }
  }
  return out;
}

function orderExpansionLabels(labels) {
  const seen = new Set(labels);
  const fromOrder = (REPORT.expansionOrder || []).filter((label) => seen.has(label));
  const rest = labels.filter((label) => !fromOrder.includes(label));
  return fromOrder.concat(rest);
}

function sectionExpansions(section) {
  if (
    (section.type !== "table" && section.type !== "heroic_aas") ||
    section.data.expansionColumn == null
  ) return [];
  const col = section.data.expansionColumn;
  return orderExpansionLabels(uniqueExpansionLabels(section.data.rows.map((r) => r[col])));
}

function expansionFilterOptions(section) {
  if (
    (section.type === "table" || section.type === "heroic_aas") &&
    section.data.expansionColumn != null
  ) {
    return sectionExpansions(section);
  }
  if (section.data?.expansionOptions?.length) {
    return orderExpansionLabels(section.data.expansionOptions);
  }
  return [];
}

function activeExpansionFilter(section) {
  if (Object.prototype.hasOwnProperty.call(state.expansions, section.id)) {
    return state.expansions[section.id];
  }
  return "";
}

function nestedColumnOptions(section, columnField) {
  if (section.type !== "table" || section.data[columnField] == null) return [];
  const col = section.data[columnField];
  const expansionCol = section.data.expansionColumn;
  const expansionFilter = activeExpansionFilter(section);
  const seen = new Set();
  const out = [];
  for (const row of section.data.rows) {
    if (expansionFilter && expansionCol != null && row[expansionCol] !== expansionFilter) continue;
    const value = row[col];
    if (value && !seen.has(value)) {
      seen.add(value);
      out.push(value);
    }
  }
  out.sort((a, b) => String(a).localeCompare(String(b)));
  return out;
}

function zoneFilterOptions(section) {
  return nestedColumnOptions(section, "zoneColumn");
}

function eventFilterOptions(section) {
  return nestedColumnOptions(section, "eventColumn");
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

function icon(name) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", "#" + name);
  svg.appendChild(use);
  return svg;
}

function charColor(index) {
  return CHAR_COLORS[index % CHAR_COLORS.length];
}

function filterChipLabel(character, all) {
  const abbr = String(character.classAbbr || "").trim().toUpperCase();
  const name = character.shortName || character.name;
  if (abbr) return `${name} ( ${abbr} )`;
  const shared = (all || []).some(
    (other) => other !== character && other.shortName === character.shortName
  );
  return shared ? character.name : name;
}

function resolveCharacter(filterKey) {
  if (!filterKey || filterKey === "all") return null;
  const chars = REPORT.meta.characters || [];
  return (
    chars.find((c) => c.name === filterKey) ||
    chars.find((c) => c.shortName === filterKey) ||
    null
  );
}

function selectedCharacterFilters() {
  const keys = state.characterFilters || [];
  if (!keys.length) return null;
  return keys.map((key) => {
    const match = resolveCharacter(key);
    return match ? { name: match.name, shortName: match.shortName } : { name: key, shortName: key };
  });
}

function selectedCharacterNames() {
  const filters = selectedCharacterFilters();
  return filters ? filters.map((f) => f.name) : null;
}

function rowMatchesCharacterFilter(rowValue) {
  const filters = selectedCharacterFilters();
  if (!filters) return true;
  return filters.some((f) => rowValue === f.name || rowValue === f.shortName);
}

function filteredColumnIndices(characters) {
  const targets = selectedCharacterNames();
  if (!targets) return characters.map((_, i) => i);
  const wanted = new Set(targets);
  return characters.map((name, i) => (wanted.has(name) ? i : -1)).filter((i) => i >= 0);
}

function classAbbrForColumn(data, idx) {
  const listed = (data.classAbbrs || [])[idx];
  if (listed) return listed;
  const name = data.characters[idx];
  const match = (REPORT.meta.characters || []).find((c) => c.name === name);
  return (match && match.classAbbr) || "";
}

function columnMissingTotal(data, idx, blocks) {
  let sum = 0;
  blocks.forEach((block) => {
    (block.rows || []).forEach((row) => {
      sum += row.counts[idx] || 0;
    });
  });
  return sum;
}

function sortedColumnIndices(section, blocks) {
  const data = section.data;
  const indices = filteredColumnIndices(data.characters);
  const mode = state.colSorts[section.id] || "roster";
  if (mode === "roster" || indices.length < 2) return indices;

  const nameOf = (idx) => data.characters[idx] || "";
  const sorted = indices.slice();
  sorted.sort((a, b) => {
    if (mode === "name") return compareValues(nameOf(a), nameOf(b));
    if (mode === "class") {
      const byClass = compareValues(classAbbrForColumn(data, a), classAbbrForColumn(data, b));
      return byClass || compareValues(nameOf(a), nameOf(b));
    }
    if (mode === "missing") {
      const byCount = columnMissingTotal(data, b, blocks) - columnMissingTotal(data, a, blocks);
      return byCount || compareValues(nameOf(a), nameOf(b));
    }
    return 0;
  });
  return sorted;
}

function rowPassesSlotFilter(row) {
  if (state.slotFilter === "all") return true;
  if (state.slotFilter === "visible") return row.visibility === "Visible";
  return row.visibility === "Non-visible";
}

function gearStyle(cell) {
  if (!cell) return "empty";
  const code = cell.tierCode || "";
  return REPORT.theme.tierCodes[code] ? `background:#${REPORT.theme.tierCodes[code]}` : "";
}

function cellText(val) {
  if (val == null) return "";
  if (typeof val === "object") {
    const bits = [];
    if (val.text != null) bits.push(String(val.text));
    if (val.chip) bits.push(String(val.chip));
    return bits.join(" ");
  }
  return String(val);
}

function cellPlainText(val) {
  if (val == null) return "";
  if (typeof val === "object" && val.text != null) return String(val.text);
  return String(val);
}

function compareValues(a, b) {
  const av = typeof a === "object" && a && "text" in a ? a.text : a;
  const bv = typeof b === "object" && b && "text" in b ? b.text : b;
  if (av == null && bv == null) return 0;
  if (av == null) return -1;
  if (bv == null) return 1;
  if (typeof av === "number" && typeof bv === "number") return av - bv;
  return String(av).localeCompare(String(bv), undefined, { numeric: true, sensitivity: "base" });
}

function activeSection() {
  return REPORT.sections[state.activeTab];
}

function characterFilterOptions(section) {
  const col = section.data.characterColumn;
  const namesInRows = new Set(section.data.rows.map((r) => r[col]));
  const options = [{ value: "", label: "All characters" }];
  const matched = (REPORT.meta.characters || []).filter((c) => namesInRows.has(c.name));
  if (matched.length) {
    matched.forEach((c) =>
      options.push({ value: c.name, label: filterChipLabel(c, matched) })
    );
    return options;
  }
  [...namesInRows].sort().forEach((name) => options.push({ value: name, label: name }));
  return options;
}

function updateToolbar() {
  const toolbar = document.getElementById("toolbar");
  toolbar.innerHTML = "";
  const section = activeSection();
  if (!section) return;

  const searchWrap = el("div", "search-wrap");
  searchWrap.appendChild(icon("icon-search"));
  const search = document.createElement("input");
  search.type = "search";
  if (section.type === "gear_matrix") {
    search.placeholder = "Filter items…";
  } else if (section.type === "missing_runes") {
    search.placeholder = "Search rune tiers…";
  } else if (section.type === "rune_inventory") {
    search.placeholder = "Search rune tiers…";
  } else if (section.type === "slot2_augs") {
    search.placeholder = "Search augs…";
  } else if (section.type === "type5_augs") {
    search.placeholder = "Search type 5 augs…";
  } else if (section.type === "type18_augs") {
    search.placeholder = "Search type 18/19 augs…";
  } else if (section.type === "raid_bis") {

function itemInspectCard(itemId) {
  return (REPORT.itemCards || {})[String(itemId)] || null;
}

function itemInspectIconUri(iconId) {
  if (!iconId) return "";
  const key = String(iconId);
  const extra = (REPORT.itemCardIcons || {})[key];
  if (extra) return extra;
  for (const section of REPORT.sections || []) {
    if (section.type === "raid_bis") {
      const uri = (section.data && section.data.iconDataUris || {})[key];
      if (uri) return uri;
    }
  }
  return "";
}

function itemInspectExpacUri(code) {
  if (!code) return "";
  return (REPORT.itemCardExpansions || {})[String(code)] || "";
}

function hideItemInspectCard() {
  if (state.inspectCardTimer) {
    clearTimeout(state.inspectCardTimer);
    state.inspectCardTimer = 0;
  }
  const node = document.getElementById("itemInspectCard");
  if (node) node.remove();
}

function inspectValueHtml(raw) {
  const text = String(raw || "");
  const parts = text.split(/\s+\+\s+/);
  if (parts.length === 2 && /^\d+$/.test(parts[0]) && /^\d+$/.test(parts[1])) {
    return `${escHtml(parts[0])} <span class="item-inspect-heroic">+ ${escHtml(parts[1])}</span>`;
  }
  return escHtml(text);
}

function inspectStatColHtml(block) {
  const labels = block.labels || [];
  if (!labels.length) return "";
  const values = block.values || [];
  let html = `<div class="item-inspect-col">`;
  labels.forEach((lab, i) => {
    const name = String(lab || "").replace(/:$/, "") + ":";
    html += `<span class="lab">${escHtml(name)}</span><span class="val">${inspectValueHtml(values[i] || "")}</span>`;
  });
  html += "</div>";
  return html;
}

function inspectStatsRowHtml(cols) {
  const parts = (cols || []).filter(Boolean);
  if (!parts.length) return "";
  return `<div class="item-inspect-stats" style="grid-template-columns:repeat(${parts.length}, minmax(0, 1fr))">${parts.join("")}</div>`;
}

function inspectAugHtml(label) {
  return `<div class="item-inspect-aug"><span class="item-inspect-aug-well"></span><span>${escHtml(label)}</span></div>`;
}

function inspectMetaHtml(card) {
  const rows = [
    ["Size", card.size],
    ["Weight", card.weight],
    ["Tribute", card.tribute],
    ["Req Lvl", card.reqLevel],
  ].filter((row) => row[1]);
  if (!rows.length) return "";
  return inspectStatColHtml({
    labels: rows.map((row) => row[0]),
    values: rows.map((row) => row[1]),
  });
}

function showItemInspectCard(anchor, itemId) {
  hideItemInspectCard();
  const card = itemInspectCard(itemId);
  if (!anchor || !card) return;
  state.inspectCardTimer = setTimeout(() => {
    state.inspectCardTimer = 0;
    hideItemInspectCard();
    const balloon = el("div", "item-inspect");
    balloon.id = "itemInspectCard";
    const iconUri = itemInspectIconUri(card.iconId);
    const expacUri = itemInspectExpacUri(card.expansionCode);
    const blocks = card.statBlocks || [];
    const vitals = blocks[0] && String(blocks[0].labels[0] || "").toUpperCase() === "AC" ? blocks[0] : null;
    const rest = vitals ? blocks.slice(1) : blocks;
    let html = `<div class="item-inspect-head"><div class="item-inspect-name">${escHtml(card.name)}</div><div class="item-inspect-expac">`;
    if (expacUri) html += `<img alt="" src="${escHtml(expacUri)}">`;
    if (card.tier) html += `<div class="item-inspect-tier">${escHtml(card.tier)}</div>`;
    html += `</div></div><div class="item-inspect-identity">`;
    html += iconUri
      ? `<img class="item-inspect-icon" alt="" src="${escHtml(iconUri)}">`
      : `<span class="item-inspect-icon-empty"></span>`;
    html += `<div>`;
    if ((card.flags || []).length) html += `<div class="item-inspect-flags">${escHtml(card.flags.join(", "))}</div>`;
    if (card.classes) html += `<div class="item-inspect-line"><span class="item-inspect-k">Class:</span> ${escHtml(card.classes)}</div>`;
    if (card.races) html += `<div class="item-inspect-line"><span class="item-inspect-k">Race:</span> ${escHtml(card.races)}</div>`;
    if (card.slot) html += `<div class="item-inspect-line"><span class="item-inspect-k">Slot:</span> ${escHtml(card.slot)}</div>`;
    html += `</div></div>`;
    (card.augSlotsTop || []).forEach((aug) => {
      if (String(aug).toLowerCase().includes("power source")) return;
      html += inspectAugHtml(aug);
    });
    html += inspectStatsRowHtml([inspectMetaHtml(card), vitals ? inspectStatColHtml(vitals) : ""]);
    html += inspectStatsRowHtml(rest.map((block) => inspectStatColHtml(block)));
    if (card.effect || card.focus) {
      html += `<div class="item-inspect-spells">`;
      if (card.effect) html += `<div><span class="item-inspect-k">Effect:</span> ${escHtml(card.effect)}</div>`;
      if (card.focus) html += `<div><span class="item-inspect-k">Focus:</span> ${escHtml(card.focus)}</div>`;
      html += `</div>`;
    }
    (card.augSlotsBottom || []).forEach((aug) => {
      if (String(aug).toLowerCase().includes("power source")) return;
      html += inspectAugHtml(aug);
    });
    if (card.lore) html += `<div class="item-inspect-lore">Item Lore: ${escHtml(card.lore)}</div>`;
    balloon.innerHTML = html;
    document.body.appendChild(balloon);
    const rect = anchor.getBoundingClientRect();
    const width = balloon.offsetWidth;
    const height = balloon.offsetHeight;
    let left = rect.left + rect.width / 2 - width / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - width - 8));
    let top = rect.top - height - 8;
    if (top < 8) top = Math.min(rect.bottom + 8, window.innerHeight - height - 8);
    balloon.style.left = left + "px";
    balloon.style.top = Math.max(8, top) + "px";
  }, 200);
}

function bindItemInspectCard(node, itemId) {
  const id = Number(itemId) || 0;
  if (!node || id <= 0 || !itemInspectCard(id)) return;
  node.addEventListener("mouseenter", () => showItemInspectCard(node, id));
  node.addEventListener("mouseleave", hideItemInspectCard);
  node.addEventListener("focus", () => showItemInspectCard(node, id));
  node.addEventListener("blur", hideItemInspectCard);
}

function updateGearMatrixContent(content, section, tierMode) {
  const data = section.data;
  const q = (state.searches[section.id] || "").trim().toLowerCase();
  const colIndices = filteredColumnIndices(data.characters);

  const wrap = el("div", "table-wrap");
  const table = document.createElement("table");
  table.className = "gear-table";
  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");

  const slotTh = el("th", "sticky-col");
  slotTh.appendChild(icon("icon-pin"));
  slotTh.appendChild(document.createTextNode(" Slot"));
  headRow.appendChild(slotTh);

  colIndices.forEach((idx) => {
    const th = el("th");
    const head = el("span", "char-head");
    const dot = el("span", "char-dot");
    const color = charColor(idx);
    dot.style.background = color.dot;
    head.appendChild(dot);
    head.appendChild(document.createTextNode(data.characters[idx]));
    th.appendChild(head);
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  data.rows.forEach((row) => {
    if (!rowPassesSlotFilter(row)) return;
    const rowText = [row.slot, ...row.cells.map((c) => (c ? (c.name || c.label || "") : ""))]
      .join(" ")
      .toLowerCase();
    if (q && !rowText.includes(q)) return;

    const tr = document.createElement("tr");
    tr.appendChild(el("td", "sticky-col", row.slot));
    colIndices.forEach((idx) => {
      const cell = row.cells[idx];
      const td = document.createElement("td");
      if (!cell) {
        td.className = "empty";
      } else if (tierMode) {
        const label = cell.label || "";
        if (cell.url) {
          const a = document.createElement("a");
          a.href = cell.url;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = label;
          if (cell.name && !itemInspectCard(cell.itemId)) a.title = cell.name;
          td.appendChild(a);
          bindItemInspectCard(a, cell.itemId);
        } else {
          td.textContent = label;
          if (cell.name && !itemInspectCard(cell.itemId)) td.title = cell.name;
          bindItemInspectCard(td, cell.itemId);
        }
        const style = gearStyle(cell);
        if (style) td.setAttribute("style", style);
      } else {
        if (cell.url) {
          const a = document.createElement("a");
          a.href = cell.url;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = cell.name;
          td.appendChild(a);
          bindItemInspectCard(a, cell.itemId);
        } else {
          td.textContent = cell.name;
          bindItemInspectCard(td, cell.itemId);
        }
        const style = gearStyle(cell);
        if (style) td.setAttribute("style", style);
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  content.appendChild(wrap);
}

function filteredTableRows(section) {
  const data = section.data;
  const sort = state.sorts[section.id] || { col: null, dir: 1 };
  let rows = data.rows.slice();
  const q = (state.searches[section.id] || "").trim().toLowerCase();
  if (q) rows = rows.filter((r) => r.map(cellText).join(" ").toLowerCase().includes(q));

  const charFilter = state.chars[section.id] || "";
  if (data.characterColumn != null) {
    if (charFilter) {
      rows = rows.filter((r) => r[data.characterColumn] === charFilter);
    } else {
      rows = rows.filter((r) => rowMatchesCharacterFilter(r[data.characterColumn]));
    }
  }
  if (data.expansionColumn != null) {
    const expansionFilter = activeExpansionFilter(section);
    if (expansionFilter) {
      rows = rows.filter((r) => r[data.expansionColumn] === expansionFilter);
    }
  }
  if (data.zoneColumn != null && state.zones[section.id]) {
    rows = rows.filter((r) => r[data.zoneColumn] === state.zones[section.id]);
  }
  if (data.eventColumn != null && state.events[section.id]) {
    rows = rows.filter((r) => r[data.eventColumn] === state.events[section.id]);
  }
  if (data.blockColumn != null && state.blocks[section.id]) {
    rows = rows.filter((r) => r[data.blockColumn] === state.blocks[section.id]);
  }
  if (data.runeColumn != null && state.runes[section.id]) {
    rows = rows.filter((r) => r[data.runeColumn] === state.runes[section.id]);
  }
  if (sort.col != null) {
    rows.sort((a, b) => sort.dir * compareValues(a[sort.col], b[sort.col]));
  }
  return rows;
}

function copyTextToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    const area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.left = "-9999px";
    document.body.appendChild(area);
    area.select();
    try {
      if (!document.execCommand("copy")) reject(new Error("copy failed"));
      else resolve();
    } catch (err) {
      reject(err);
    } finally {
      area.remove();
    }
  });
}

  const balloon = el("div", "copy-balloon");
  balloon.id = "copyBalloon";
  balloon.appendChild(el("div", "copy-balloon-label", "Copied to clipboard"));
  balloon.appendChild(el("div", "copy-balloon-name", itemName));
  document.body.appendChild(balloon);
  const rect = anchor.getBoundingClientRect();
  const width = balloon.offsetWidth;
  const height = balloon.offsetHeight;
  let left = rect.left + rect.width / 2 - width / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - width - 8));
  let top = rect.top - height - 8;
  if (top < 8) top = rect.bottom + 8;
  balloon.style.left = left + "px";
  balloon.style.top = top + "px";
  state.copyBalloonTimer = setTimeout(() => balloon.remove(), 1800);
}

const COPY_COL_TIP = "Clicking the link copies the name to your clipboard.";

function hideHeaderTipBalloon() {
  document.getElementById("headerTipBalloon")?.remove();
}

function showHeaderTipBalloon(anchor, text) {
  hideHeaderTipBalloon();
  if (!anchor || !text) return;
  const balloon = el("div", "copy-balloon");
  balloon.id = "headerTipBalloon";
  balloon.appendChild(el("div", "copy-balloon-name", text));
  document.body.appendChild(balloon);
  const rect = anchor.getBoundingClientRect();
  const width = balloon.offsetWidth;
  const height = balloon.offsetHeight;
  let left = rect.left + rect.width / 2 - width / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - width - 8));
  let top = rect.top - height - 8;
  if (top < 8) top = rect.bottom + 8;
  balloon.style.left = left + "px";
  balloon.style.top = top + "px";
}

function updateTableContent(content, section) {
  hideHeaderTipBalloon();
  const data = section.data;
  const sort = state.sorts[section.id] || { col: null, dir: 1 };
  const rows = filteredTableRows(section);

  const wrap = el("div", "table-wrap");
  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");
  data.columns.forEach((col, idx) => {
    const th = el("th", sort.col === idx ? (sort.dir > 0 ? "sort-asc" : "sort-desc") : null, col);
    if (data.copyColumn === idx) {
      th.classList.add("copy-col-head");
      th.tabIndex = 0;
      th.addEventListener("mouseenter", () => showHeaderTipBalloon(th, COPY_COL_TIP));
      th.addEventListener("mouseleave", hideHeaderTipBalloon);
      th.addEventListener("focus", () => showHeaderTipBalloon(th, COPY_COL_TIP));
      th.addEventListener("blur", hideHeaderTipBalloon);
    }
    th.addEventListener("click", () => {
      if (sort.col === idx) sort.dir *= -1;
      else { sort.col = idx; sort.dir = 1; }
      state.sorts[section.id] = sort;
      refreshContent();
    });
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  rows.forEach((row) => {
    const tr = document.createElement("tr");
    row.forEach((val, idx) => {
      if (data.copyColumn === idx && cellPlainText(val)) {
        const text = cellPlainText(val);
        const td = document.createElement("td");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "copy-item";
        btn.textContent = text;
        btn.title = "Click to copy";
        btn.addEventListener("click", (ev) => {
          ev.stopPropagation();
          copyTextToClipboard(text).then(() => {
            btn.classList.add("copied");
            showCopyBalloon(btn, text);
            setTimeout(() => btn.classList.remove("copied"), 900);
          }).catch(() => {});
        });
        td.appendChild(btn);
        tr.appendChild(td);
      } else if (val && typeof val === "object" && (val.chip || val.url)) {
        const td = document.createElement("td");
        const text = cellPlainText(val);
        if (val.url) {
          const a = document.createElement("a");
          a.href = val.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = text;
          td.appendChild(a);
        } else {
          td.appendChild(document.createTextNode(text));
        }
        if (val.chip) td.appendChild(el("span", "cell-chip", String(val.chip)));
        tr.appendChild(td);
      } else {
        tr.appendChild(el("td", null, cellPlainText(val)));
      }
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  content.appendChild(wrap);
  if (data.credit && data.credit.text && data.credit.url) {
    const credit = el("p", "section-credit");
    const link = document.createElement("a");
    link.href = data.credit.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = data.credit.text;
    credit.appendChild(link);
    content.appendChild(credit);
  }
}

function achievementGroupTitle(row, spec) {
  if (spec.titleColumns && spec.titleColumns.length) {
    return spec.titleColumns.map((idx) => String(row[idx] || "")).join(spec.titleJoin || " ");
  }
  return String(row[spec.titleColumn] || "");
}

function achievementGroupDescription(row, spec) {
  if (spec.descriptionKind === "quests") {
    return (
      "This achievement is gained upon completing the following story quests in " +
      String(row[spec.zoneColumn] || "") +
      "."
    );
  }
  return "This achievement is gained upon completing the following raid objectives.";
}

function updateAchievementGroupsContent(content, section) {
  const spec = section.data.group || {};
  const rows = filteredTableRows(section);
  const list = el("div", "quest-list");
  if (!rows.length) {
    list.appendChild(el("p", "quest-empty", spec.empty || "No matching achievements."));
    content.appendChild(list);
    return;
  }

  const keyColumns = spec.keyColumns || [0, 1, 2];
  const itemColumn = spec.itemColumn != null ? spec.itemColumn : 3;
  const statusColumn = spec.statusColumn != null ? spec.statusColumn : 4;
  const groups = [];
  const index = new Map();
  rows.forEach((row) => {
    const key = keyColumns.map((idx) => String(row[idx] || "")).join("\0");
    let group = index.get(key);
    if (!group) {
      group = {
        character: String(row[0] || ""),
        expansion: String(row[1] || ""),
        title: achievementGroupTitle(row, spec),
        description: achievementGroupDescription(row, spec),
        items: [],
      };
      index.set(key, group);
      groups.push(group);
    }
    group.items.push({
      name: String(row[itemColumn] || ""),
      done: String(row[statusColumn] || "") === "Done",
    });
  });

  groups.forEach((group) => {
    const missing = group.items.filter((item) => !item.done).length;
    const done = group.items.length - missing;
    const card = el("article", "quest-card");
    const head = el("div", "quest-head");
    head.appendChild(icon(spec.icon || SECTION_ICONS[section.id] || "icon-trophy"));
    head.appendChild(el("div", "quest-title", group.title));
    const metaBits = [group.character];
    if (!activeExpansionFilter(section)) metaBits.push(group.expansion);
    metaBits.push(done + "/" + group.items.length);
    head.appendChild(el("div", "quest-meta", metaBits.join(" · ")));
    card.appendChild(head);

    const body = el("div", "quest-body");
    body.appendChild(el("div", "quest-status", missing ? "Not Completed" : "Completed"));
    body.appendChild(el("p", "quest-desc", group.description));
    const items = el("ul", "quest-items");
    group.items.forEach((item) => {
      const li = el("li", item.done ? "quest-item done" : "quest-item");
      li.appendChild(el("span", "quest-check", item.done ? "X" : ""));
      li.appendChild(document.createTextNode(item.name));
      items.appendChild(li);
    });
    body.appendChild(items);
    card.appendChild(body);
    list.appendChild(card);
  });
  content.appendChild(list);
}

function filteredHeroicRows(section) {
  const data = section.data;
  let rows = data.rows.slice();
  const q = (state.searches[section.id] || "").trim().toLowerCase();
  if (q) rows = rows.filter((r) => r.map(cellText).join(" ").toLowerCase().includes(q));

  const charFilter = state.chars[section.id] || "";
  if (data.characterColumn != null) {
    if (charFilter) {
      rows = rows.filter((r) => r[data.characterColumn] === charFilter);
    } else {
      rows = rows.filter((r) => rowMatchesCharacterFilter(r[data.characterColumn]));
    }
  }
  const expansionFilter = activeExpansionFilter(section);
  if (expansionFilter && data.expansionColumn != null) {
    rows = rows.filter((r) => r[data.expansionColumn] === expansionFilter);
  }
  const statusFilter = state.status[section.id] || "";
  if (statusFilter && data.statusColumn != null) {
    rows = rows.filter((r) => r[data.statusColumn] === statusFilter);
  }
  return rows;
}

function selectedHeroicTotals(section) {
  const data = section.data;
  const totals = data.totals || [];
  const charFilter = state.chars[section.id] || "";
  if (charFilter) {
    return totals.filter((row) => row.character === charFilter);
  }
  const names = selectedCharacterNames();
  if (!names) return totals;
  const wanted = new Set(names);
  return totals.filter((row) => wanted.has(row.character));
}

function heroicStatCard(label, value, max, description) {
  const card = el("div", "heroic-stat");
  card.title = description || "";
  card.appendChild(el("div", "heroic-stat-label", label));
  const valueEl = el("div", "heroic-stat-value");
  valueEl.appendChild(document.createTextNode(String(value)));
  if (max != null) {
    const maxEl = el("span", "max", " / " + max);
    valueEl.appendChild(maxEl);
  }
  card.appendChild(valueEl);
  return card;
}

    const wrap = el("div", "table-wrap heroic-totals-table");

      head.appendChild(el("th", null, label));
    });
    table.appendChild(document.createElement("thead")).appendChild(head);
    const tbody = document.createElement("tbody");
    selectedTotals.forEach((total) => {
      const tr = document.createElement("tr");
      tr.appendChild(el("td", null, total.character));
      tr.appendChild(el("td", "count-cell", total.fortitude + " / " + data.maxFortitude));
      tr.appendChild(el("td", "count-cell", total.resolution + " / " + data.maxResolution));
      tr.appendChild(el("td", "count-cell", total.vitality + " / " + data.maxVitality));
      tr.appendChild(el("td", "count-cell", total.completed + " / " + total.total));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    content.appendChild(wrap);
  }

  const rows = filteredHeroicRows(section);
  if (!rows.length) {
    content.appendChild(el("p", "heroic-empty", "No matching Heroic AAs."));
  } else {
    const groups = [];
    const index = new Map();
    rows.forEach((row) => {
      const expansion = String(row[1] || "");
      let group = index.get(expansion);
      if (!group) {
        group = { expansion, items: [] };
        index.set(expansion, group);
        groups.push(group);
      }
      group.items.push(row);
    });
    groups.forEach((group) => {
      const block = el("div", "heroic-group");
      if (!activeExpansionFilter(section)) {
        block.appendChild(el("div", "block-title", group.expansion));
      }
      const wrap = el("div", "table-wrap");
      group.items.forEach((row) => {
        const done = String(row[6] || "") === "Completed";
        const line = el("div", done ? "heroic-row" : "heroic-row incomplete");
        const nameWrap = el("div", "heroic-row-name");
        const achievement = row[2];
        const nameEl = el("div", null, "");
        if (achievement && typeof achievement === "object" && achievement.url) {
          const a = document.createElement("a");
          a.href = achievement.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = String(achievement.text || "");
          nameEl.appendChild(a);
        } else {
          nameEl.textContent = cellPlainText(achievement);
        }
        nameWrap.appendChild(nameEl);
        if (selectedTotals.length !== 1) {
          nameWrap.appendChild(el("div", "heroic-row-meta", String(row[0] || "")));
        }
        line.appendChild(nameWrap);
        const chips = el("div", "heroic-chips");
        const chipTips = {
          F: labelOf("fortitude", "Hero's Fortitude"),
          R: labelOf("resolution", "Hero's Resolution"),
          V: labelOf("vitality", "Hero's Vitality"),
        };
        [["F", row[3]], ["R", row[4]], ["V", row[5]]].forEach(([letter, awarded]) => {
          // Catalog 0 = not awarded for this achievement — omit the chip.
          if (!awarded) return;
          const chip = el("span", done ? "heroic-chip on" : "heroic-chip", letter);
          chip.title = chipTips[letter];
          chips.appendChild(chip);
        });
        line.appendChild(chips);
        line.appendChild(
          el("div", done ? "heroic-status completed" : "heroic-status incomplete", done ? "Completed" : "Incomplete")
        );
        wrap.appendChild(line);
      });
      block.appendChild(wrap);
      content.appendChild(block);
    });
  }

  if (data.credit && data.credit.text && data.credit.url) {
    const credit = el("p", "section-credit");
    const link = document.createElement("a");
    link.href = data.credit.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = data.credit.text;
    credit.appendChild(link);
    content.appendChild(credit);
  }
}
